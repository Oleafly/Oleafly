name: Downloads badge

# Publishes the GitHub download total for the installer and package formats
# shipped by Oleafly. The allow-list leaves out updater bundles, manifests,
# signatures, SBOMs, and any future non-installer assets.
#
# The shields.io endpoint JSON lives on the unprotected `badges` branch and is
# written through the GitHub Contents API. main's protection (signed commits,
# PR-only) rejects direct bot pushes, which is exactly how the previous
# commit-to-main version of this job failed; Contents API commits are signed
# by GitHub automatically and the badges branch carries no protection rules.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Compute installer downloads and publish the badge JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          branch="badges"
          path=".github/badges/downloads.json"

          total=$(gh api --paginate "repos/${repo}/releases?per_page=100" \
            --jq '.[] | .assets[] | select(.name | test("\\.(dmg|msi|exe|deb|rpm|AppImage)$")) | .download_count' \
            | awk '{ sum += $1 } END { print sum + 0 }')
          json=$(printf '{"schemaVersion":1,"label":"Installer downloads","message":"%s","color":"22c55e"}\n' "$total")

          # Create the badges branch from main on first run.
          if ! gh api "repos/${repo}/branches/${branch}" >/dev/null 2>&1; then
            base=$(gh api "repos/${repo}/git/refs/heads/main" --jq .object.sha)
            gh api -X POST "repos/${repo}/git/refs" -f ref="refs/heads/${branch}" -f sha="$base"
          fi

          # Skip the commit when the count is unchanged.
          existing=$(gh api "repos/${repo}/contents/${path}?ref=${branch}" --jq .content 2>/dev/null | base64 -d || true)
          if [ "$existing" = "$json" ]; then
            echo "count unchanged ($total)"
            exit 0
          fi

          sha=$(gh api "repos/${repo}/contents/${path}?ref=${branch}" --jq .sha 2>/dev/null || true)
          gh api -X PUT "repos/${repo}/contents/${path}" \
            -f branch="$branch" \
            -f message="chore: downloads badge count $total" \
            -f content="$(printf '%s' "$json" | base64 | tr -d '\n')" \
            ${sha:+-f sha="$sha"}
          echo "published count $total to ${branch}"
