name: MCP registry

# Lists Oleafly's MCP server in the official MCP Registry
# (registry.modelcontextprotocol.io) as io.github.Oleafly/oleafly. Directories
# such as PulseMCP copy their listings from there.
#
# The registry entry points at oleafly.mcpb, a small bundle attached to the
# GitHub release (mcpb/, built by scripts/mcpb-release.sh). The bundle starts
# the `oleafly` command the app installs, so it needs the app.
#
# release.yml calls this after it publishes a release. That publish uses the
# workflow token, which raises no `release` event, so a `release: published`
# trigger would never fire. Run it by hand to list a release that went out
# before this workflow existed, or to retry one. A version the registry
# already has is left alone, and a bundle already on the release is reused,
# because the registry entry pins the bundle's SHA-256.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to list (e.g. v0.4.8)"
        required: true

permissions:
  contents: read

concurrency:
  group: mcp-registry-${{ inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: https://registry.modelcontextprotocol.io
  SERVER_NAME: io.github.Oleafly/oleafly

jobs:
  check:
    name: Check the release and the registry
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.state.outputs.version }}
      listed: ${{ steps.state.outputs.listed }}
      attached: ${{ steps.state.outputs.attached }}
    steps:
      - name: Read the release and the registry
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "not a release tag: $TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          echo "version=$version" >>"$GITHUB_OUTPUT"

          release="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
          if [[ "$(jq -r .isDraft <<<"$release")" != false ]]; then
            echo "$TAG is still a draft. Publish it first." >&2
            exit 1
          fi
          if jq -e '.assets | map(.name) | index("oleafly.mcpb")' <<<"$release" >/dev/null; then
            echo "attached=true" >>"$GITHUB_OUTPUT"
          else
            echo "attached=false" >>"$GITHUB_OUTPUT"
          fi

          name="$(jq -rn --arg name "$SERVER_NAME" '$name | @uri')"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "$REGISTRY/v0.1/servers/$name/versions/$version")"
          case "$status" in
            200)
              echo "listed=true" >>"$GITHUB_OUTPUT"
              echo "$SERVER_NAME $version is already in the registry; nothing to do."
              ;;
            404) echo "listed=false" >>"$GITHUB_OUTPUT" ;;
            *)
              echo "The registry lookup returned HTTP $status." >&2
              exit 1
              ;;
          esac

  publish:
    name: Publish to the MCP Registry
    needs: check
    if: ${{ needs.check.outputs.listed == 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach oleafly.mcpb to the release
      id-token: write # registry login (GitHub OIDC) and the attestation
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      MCP_PUBLISHER_VERSION: v1.8.4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build oleafly.mcpb
        if: ${{ needs.check.outputs.attached == 'false' }}
        run: bash scripts/mcpb-release.sh pack "$VERSION" oleafly.mcpb

      - name: Attest oleafly.mcpb
        if: ${{ needs.check.outputs.attached == 'false' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: oleafly.mcpb

      - name: Attach oleafly.mcpb to the release
        if: ${{ needs.check.outputs.attached == 'false' }}
        run: gh release upload "$TAG" oleafly.mcpb --repo "$GITHUB_REPOSITORY"

      - name: Reuse the oleafly.mcpb already on the release
        if: ${{ needs.check.outputs.attached == 'true' }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern oleafly.mcpb --dir . --clobber

      - name: Write server.json for this release
        shell: bash
        run: |
          set -euo pipefail
          sha="$(sha256sum oleafly.mcpb | cut -d' ' -f1)"
          bash scripts/mcpb-release.sh server-json "$VERSION" "$sha" server.release.json
          cat server.release.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish
        run: |
          ./mcp-publisher validate server.release.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.release.json
