name: CI

# Docs-only changes skip CI entirely: a push here also CANCELS any in-flight
# run on the same ref (concurrency group), so letting a README tweak through
# would kill a 30-minute three-platform e2e round.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/badges/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/badges/**"
  # Nightly full sweep. Every e2e lane also runs per push and PR: standard
  # runners are free on a public repository, and gating the desktop lanes to
  # nightly hid a total macOS failure for days.
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

# No job here writes to the repo, comments on PRs, or creates releases, so a
# read-only default covers every job below.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-platform-smoke:
    name: Markdown smoke (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Cache Tectonic sidecar
        id: cache-tectonic-md
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries/tectonic-*
          key: tectonic-${{ matrix.target }}-${{ hashFiles('scripts/fetch-tectonic.sh') }}

      - name: Fetch Tectonic sidecar
        if: steps.cache-tectonic-md.outputs.cache-hit != 'true'
        run: bash scripts/fetch-tectonic.sh ${{ matrix.target }}

      - name: Cache Pandoc archive
        uses: actions/cache@v6
        with:
          path: src-tauri/target/e2e-sidecars/pandoc-*
          key: pandoc-${{ matrix.target }}-${{ hashFiles('scripts/smoke-markdown.sh') }}

      - name: Restore Tectonic packages for the Markdown smoke
        id: tectonic-pkgs-md
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-pkgs-md-v1-${{ matrix.target }}-${{ hashFiles('scripts/fixtures/markdown-smoke.md', 'scripts/fetch-tectonic.sh') }}
          restore-keys: tectonic-pkgs-md-v1-${{ matrix.target }}-

      - name: Smoke-test managed Pandoc with packaged Tectonic input
        run: bash scripts/smoke-markdown.sh ${{ matrix.target }}

      - name: Save Tectonic packages for the Markdown smoke
        if: steps.tectonic-pkgs-md.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-pkgs-md-v1-${{ matrix.target }}-${{ hashFiles('scripts/fixtures/markdown-smoke.md', 'scripts/fetch-tectonic.sh') }}

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        # Version comes from the `packageManager` field in package.json, so CI
        # matches local + the lockfile generator. (pnpm 9 mis-parses the
        # settings-only pnpm-workspace.yaml as an empty workspace.)
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          # pnpm 11 requires Node >= 22.13; keep this at 22+ (see package.json
          # `packageManager`). Node 20 crashes pnpm's `store path` lookup.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Validate language-server manifest and fetch confinement
        run: pnpm language-servers:test

      # Biome lint gate. Blocks on correctness errors; the existing a11y/style
      # backlog is reported as (non-blocking) warnings. See biome.json.
      - name: Lint
        run: pnpm lint

      # `pnpm build` runs `tsc -b` (typecheck) then `vite build` (bundle). The
      # frontend build needs no Tectonic sidecar.
      - name: Typecheck & build
        run: pnpm build
      - name: Check performance budgets
        run: pnpm check:performance

      - name: Test with coverage
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: pnpm test:coverage

      - name: Upload frontend coverage
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage/frontend/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Test
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        run: pnpm test

      # Deterministic p95 gates for the core editor's book-scale synchronous
      # paths. The native E2E jobs below cover WebView rendering and scrolling.
      - name: Test book-scale editor performance
        run: pnpm test:editor:performance

  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Linux system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            curl wget file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> src-tauri/target

      # Tauri externalBin compilers must exist before compiling. Tinymist is
      # staged separately as an immutable resource archive below.
      - name: Cache Tectonic sidecar
        id: cache-tectonic
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries/tectonic-*
          key: tectonic-${{ runner.os }}-${{ hashFiles('scripts/fetch-tectonic.sh') }}

      - name: Fetch Tectonic sidecar
        if: steps.cache-tectonic.outputs.cache-hit != 'true'
        run: bash scripts/fetch-tectonic.sh x86_64-unknown-linux-gnu

      - name: Cache Biber sidecar
        id: cache-biber
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries/tectonic-biber-*
          key: biber-${{ runner.os }}-${{ hashFiles('scripts/fetch-biber.sh') }}

      - name: Fetch Biber sidecar
        if: steps.cache-biber.outputs.cache-hit != 'true'
        run: bash scripts/fetch-biber.sh x86_64-unknown-linux-gnu

      - name: Cache Typst sidecar
        id: cache-typst
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries/typst-*
          key: typst-${{ runner.os }}-${{ hashFiles('scripts/fetch-typst.sh') }}

      - name: Fetch Typst sidecar
        if: steps.cache-typst.outputs.cache-hit != 'true'
        run: bash scripts/fetch-typst.sh x86_64-unknown-linux-gnu

      - name: Stage checksum-pinned Tinymist resource archive
        run: node scripts/fetch-language-servers.mjs --server tinymist --target x86_64-unknown-linux-gnu --install-mode resource

      - name: Smoke-test Tinymist resource extraction and LSP handshake
        run: node scripts/smoke-language-servers.mjs --server tinymist

      - name: Smoke-test Typst sidecar
        run: bash scripts/smoke-typst.sh x86_64-unknown-linux-gnu

      - name: Cache Pandoc archive
        uses: actions/cache@v6
        with:
          path: src-tauri/target/e2e-sidecars/pandoc-*
          key: pandoc-${{ runner.os }}-x86_64-${{ hashFiles('scripts/smoke-markdown.sh') }}

      - name: Restore Tectonic packages for the Markdown smoke
        id: tectonic-pkgs-rust
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-pkgs-md-v1-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/fixtures/markdown-smoke.md', 'scripts/fetch-tectonic.sh') }}
          restore-keys: tectonic-pkgs-md-v1-x86_64-unknown-linux-gnu-

      - name: Smoke-test managed Pandoc with bundled Tectonic
        run: bash scripts/smoke-markdown.sh x86_64-unknown-linux-gnu

      - name: Save Tectonic packages for the Markdown smoke
        if: steps.tectonic-pkgs-rust.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-pkgs-md-v1-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/fixtures/markdown-smoke.md', 'scripts/fetch-tectonic.sh') }}

      - name: Install cargo-llvm-cov
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Test with coverage
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          mkdir -p coverage/rust
          cargo llvm-cov --workspace --all-targets --lcov --output-path coverage/rust/lcov.info

      - name: Upload Rust coverage
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: coverage/rust/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Test
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        run: cargo test --workspace --all-targets

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.77.0

      - name: Check core and CLI against the Rust 1.77 MSRV
        run: cargo +1.77.0 check -p oleafly-core -p oleafly-cli --all-targets

  rust-windows:
    name: Rust tests (Windows Job Objects)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> src-tauri/target

      - name: Fetch compiler sidecars
        shell: bash
        run: |
          bash scripts/fetch-tectonic.sh x86_64-pc-windows-msvc
          bash scripts/fetch-biber.sh x86_64-pc-windows-msvc
          bash scripts/fetch-typst.sh x86_64-pc-windows-msvc

      - name: Stage checksum-pinned Tinymist resource archive
        run: node scripts/fetch-language-servers.mjs --server tinymist --target x86_64-pc-windows-msvc --install-mode resource

      - name: Run the native Windows test suite
        env:
          OLEAFLY_EMBED_TEST_MANIFEST: "1"
        run: cargo test --workspace --lib

      - name: Run the oleaflyc command tests
        run: cargo test -p oleafly-cli --test cli

      - name: Install minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.77.0


  cargo-deny:
    # RustSec advisories plus a permissive-only license gate for the Rust workspace.
    # Policy lives in src-tauri/deny.toml.
    name: Rust (cargo-deny audit)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml
          command: check
          arguments: --workspace --all-features --config src-tauri/deny.toml

  sonarqube:
    name: SonarQube Cloud
    needs: [frontend, rust]
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download frontend coverage
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: coverage/frontend

      - name: Download Rust coverage
        uses: actions/download-artifact@v8
        with:
          name: rust-coverage
          path: coverage/rust

      - name: Validate SonarQube Cloud configuration
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_ORGANIZATION" || { echo "SONAR_ORGANIZATION repository variable is missing" >&2; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "SONAR_PROJECT_KEY repository variable is missing" >&2; exit 1; }
          test -n "$SONAR_TOKEN" || { echo "SONAR_TOKEN repository secret is missing" >&2; exit 1; }

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  e2e-build-macos:
    # Builds the packaged e2e app once so the four macOS shards run tests
    # instead of each compiling the whole app from source. The bundle carries
    # test hooks (VITE_E2E_HOOKS=1) and must never ship; the production build
    # keeps its hook audit fatal.
    name: E2E app build (macOS)
    needs: [frontend, rust]
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # The vite build graph exceeds Node's default ~4GB heap on the 7GB
      # macOS arm64 runners (same setting as release.yml).
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> src-tauri/target

      - name: Cache Tectonic sidecar
        id: cache-tectonic-e2e-build
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries/tectonic-*
          key: tectonic-${{ runner.os }}-${{ hashFiles('scripts/fetch-tectonic.sh') }}

      - name: Fetch Tectonic sidecar
        if: steps.cache-tectonic-e2e-build.outputs.cache-hit != 'true'
        run: bash scripts/fetch-tectonic.sh aarch64-apple-darwin

      - name: Cache Biber sidecar
        id: cache-biber-e2e-build
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries/tectonic-biber-*
          key: biber-${{ runner.os }}-${{ hashFiles('scripts/fetch-biber.sh') }}

      - name: Fetch Biber sidecar
        if: steps.cache-biber-e2e-build.outputs.cache-hit != 'true'
        run: bash scripts/fetch-biber.sh aarch64-apple-darwin

      - name: Cache Typst sidecar
        id: cache-typst-e2e-build
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries/typst-*
          key: typst-${{ runner.os }}-${{ hashFiles('scripts/fetch-typst.sh') }}

      - name: Fetch Typst sidecar
        if: steps.cache-typst-e2e-build.outputs.cache-hit != 'true'
        run: bash scripts/fetch-typst.sh aarch64-apple-darwin

      - name: Stage checksum-pinned Tinymist resource archive
        run: node scripts/fetch-language-servers.mjs --server tinymist --target aarch64-apple-darwin --install-mode resource

      # Third-platform coverage for the shared crates, moved here from the
      # shard jobs so shards stay pure test runners.
      - name: Run shared core and oleaflyc tests
        run: cargo test -p oleafly-core -p oleafly-cli --all-targets

      - name: Build the packaged e2e app
        env:
          VITE_E2E_HOOKS: "1"
        run: pnpm tauri build --debug --features e2e-testing --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Pack the app bundle
        run: tar -czf oleafly-e2e-macos.tar.gz -C src-tauri/target/debug/bundle/macos Oleafly.app

      - name: Upload the app bundle
        uses: actions/upload-artifact@v7
        with:
          name: e2e-app-macos
          path: oleafly-e2e-macos.tar.gz
          retention-days: 1

  e2e-build-linux:
    # Same idea as e2e-build-macos: compile the packaged e2e app once instead of
    # four times from source inside the shards. On Linux the self-contained unit
    # is the .deb, so the shards install it rather than unpacking a bundle
    # directory. Removing the per-shard compile is also the point: the shards are
    # 2-core runners on software GL, and a concurrent cargo build starves the
    # webview badly enough that single evals exceed the bridge's hard 30s cap.
    name: E2E app build (Linux)
    needs: [frontend, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            curl wget file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> src-tauri/target

      - name: Cache Tectonic sidecar
        id: cache-tectonic-e2e-build-linux
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries/tectonic-*
          key: tectonic-${{ runner.os }}-${{ hashFiles('scripts/fetch-tectonic.sh') }}

      - name: Fetch Tectonic sidecar
        if: steps.cache-tectonic-e2e-build-linux.outputs.cache-hit != 'true'
        run: bash scripts/fetch-tectonic.sh x86_64-unknown-linux-gnu

      - name: Cache Biber sidecar
        id: cache-biber-e2e-build-linux
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries/tectonic-biber-*
          key: biber-${{ runner.os }}-${{ hashFiles('scripts/fetch-biber.sh') }}

      - name: Fetch Biber sidecar
        if: steps.cache-biber-e2e-build-linux.outputs.cache-hit != 'true'
        run: bash scripts/fetch-biber.sh x86_64-unknown-linux-gnu

      - name: Cache Typst sidecar
        id: cache-typst-e2e-build-linux
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries/typst-*
          key: typst-${{ runner.os }}-${{ hashFiles('scripts/fetch-typst.sh') }}

      - name: Fetch Typst sidecar
        if: steps.cache-typst-e2e-build-linux.outputs.cache-hit != 'true'
        run: bash scripts/fetch-typst.sh x86_64-unknown-linux-gnu

      - name: Smoke-test Typst sidecar
        run: bash scripts/smoke-typst.sh x86_64-unknown-linux-gnu

      - name: Stage checksum-pinned Tinymist resource archive
        run: node scripts/fetch-language-servers.mjs --server tinymist --target x86_64-unknown-linux-gnu --install-mode resource

      - name: Build the packaged e2e app
        env:
          VITE_E2E_HOOKS: "1"
        run: pnpm tauri build --debug --features e2e-testing --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # The shards install this blind, so record the layout here where the log
      # is cheap to read. If a future Tauri release moves the binary or the
      # sidecars, this listing is the first place that shows it.
      - name: Stage and describe the package
        run: |
          set -euo pipefail
          deb="$(find src-tauri/target/debug/bundle/deb -name '*.deb' -print -quit)"
          test -n "$deb"
          cp "$deb" oleafly-e2e-linux.deb
          # Every line below is a diagnostic, and a diagnostic must never be able
          # to fail the build. Under `set -o pipefail` a grep that matches
          # nothing returns 1 and takes the step down with it, which is exactly
          # what happened the first time this ran - the package was fine and the
          # description of it was what failed. Write the listing to a file, then
          # read slices out of it, and guard every filter.
          dpkg-deb -c oleafly-e2e-linux.deb > deb-contents.txt
          echo "--- layout sample (first 20 entries) ---"
          sed -n '1,20p' deb-contents.txt
          echo "--- executables ---"
          grep -E '/(bin|sbin)/' deb-contents.txt || echo "(none matched /bin/)"
          echo "--- libexec, resources, sidecars (first 25) ---"
          grep -E '/lib/' deb-contents.txt | sed -n '1,25p' || echo "(none matched /lib/)"
          echo "--- $(wc -l < deb-contents.txt) entries total ---"

      - name: Upload the app package
        uses: actions/upload-artifact@v7
        with:
          name: e2e-app-linux
          path: oleafly-e2e-linux.deb
          retention-days: 1

  e2e:
    # The full no-mock suite against the real app (WKWebView + Rust + Tectonic
    # compiles) on macOS. Tests that need credentials (GitHub PAT, AI keys) skip
    # automatically when their E2E_* env vars are absent, so CI runs the ungated
    # tests.
    name: E2E (real app, macOS, shard ${{ matrix.shard }}/4)
    needs: e2e-build-macos
    runs-on: macos-15
    # Sharded like the Linux lane. Serially the suite needs more than the
    # ceiling below, so an unsharded run was killed mid-suite and reported
    # nothing about the specs it never reached.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Hard ceiling well under the job cap: a systemically broken environment
    # (e.g. the webview failing to start) must fail fast, not burn billed
    # macOS minutes timing out 118 tests one by one.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the packaged e2e app
        uses: actions/download-artifact@v8
        with:
          name: e2e-app-macos

      - name: Unpack the app bundle
        run: |
          mkdir -p e2e-app
          tar -xzf oleafly-e2e-macos.tar.gz -C e2e-app
          test -x "e2e-app/Oleafly.app/Contents/MacOS/Oleafly"

      # First compiles fetch LaTeX packages over the network, so the suite's
      # early compiles time out if the runner's Tectonic cache is cold. Restore
      # it, then pre-warm by compiling every bundled template with the sidecar.
      # Pre-warm runs UNCONDITIONALLY (not just on a cache miss): a past failing
      # run can save an incomplete cache that later "hits" but still leaves the
      # app compiling cold, so we always warm the live cache before the suite.
      - name: Restore Tectonic packages
        id: tectonic-pkgs
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/Tectonic
          key: tectonic-pkgs-v3-${{ runner.os }}-${{ hashFiles('src-tauri/resources/templates/**/main.tex') }}
          restore-keys: tectonic-pkgs-v3-${{ runner.os }}-

      - name: Pre-warm the Tectonic package cache
        run: |
          BIN="$PWD/e2e-app/Oleafly.app/Contents/MacOS/tectonic"
          mkdir -p /tmp/prewarm
          for f in src-tauri/resources/templates/*/main.tex; do
            (cd "$(dirname "$f")" && "$BIN" -o /tmp/prewarm main.tex) || true
          done

      - name: Save Tectonic packages
        if: steps.tectonic-pkgs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/Tectonic
          key: tectonic-pkgs-v3-${{ runner.os }}-${{ hashFiles('src-tauri/resources/templates/**/main.tex') }}

      # The fixture machinery needs a Playwright browser even in tauri mode.
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/ms-playwright
            ~/.cache/ms-playwright
            ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        env:
          DEBUG: pw:install
        run: pnpm exec playwright install chromium

      - name: Run the e2e suite
        # This lane exists to report the state of a platform the per-push Linux
        # shards never exercise, so it keeps going after a failure and lists
        # every broken spec. Stopping at the first one turned three macOS
        # regressions into three separate hour-long rounds, because each fix
        # only unmasked the next. The caps still abandon a systemically broken
        # environment rather than timing out spec by spec, and --global-timeout
        # bounds the complete suite to 50 minutes.
        env:
          OLEAFLY_E2E_APP_BINARY: ${{ github.workspace }}/e2e-app/Oleafly.app/Contents/MacOS/Oleafly
          # Pinned so a failure is reproducible; blank on the nightly so the
          # random-seed exploration still happens off the blocking path. Written
          # in this order because an empty string is falsy in a GitHub
          # expression, so the obvious `== 'schedule' && '' || SEED` returns the
          # seed in both branches.
          E2E_INTERACTION_SEED: ${{ github.event_name != 'schedule' && '62024' || '' }}
        run: ./scripts/e2e.sh --shard=${{ matrix.shard }}/4 --suite-max-failures=6 --max-failures=10 --global-timeout=3000000

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-macos-shard-${{ matrix.shard }}
          # Only the small, useful debugging files. Avoids uploading the macOS
          # driver's ~1 GB per-run screencast blob that lives under test-results/.
          path: |
            test-results/**/error-context.md
            test-results/**/trace.zip
            test-results/**/*.log
            e2e-artifacts/**/error-context.md
            e2e-artifacts/**/trace.zip
            e2e-artifacts/**/*.log
            e2e-debug/**
          retention-days: 7
          if-no-files-found: ignore

  e2e-linux:
    # The same no-mock suite on Linux (WebKitGTK + Rust + Tectonic). The
    # socket bridge, hermetic data dir, and shortcut handling are all
    # platform-neutral; the app runs under xvfb.
    # Fast lane: this is the per-push e2e signal, split across four parallel
    # shards so a full sweep lands in ~15-20 minutes instead of ~50.
    name: E2E (real app, Linux, shard ${{ matrix.shard }}/4)
    needs: e2e-build-linux
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # 24.04, not 22.04: the upstream Tectonic release binary needs glibc 2.39.
    # Must match e2e-build-linux, which produced the .deb this installs.
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the packaged e2e app
        uses: actions/download-artifact@v8
        with:
          name: e2e-app-linux

      # apt resolves the package's own runtime dependencies (webkit2gtk and
      # friends), so this replaces the -dev package list and the Rust toolchain
      # the shard used to need to build the app itself. The binary path is read
      # back out of the installed package rather than hardcoded, so a Tauri
      # bundler layout change surfaces as a clear failure here instead of a
      # confusing one inside the suite.
      - name: Install the packaged e2e app
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb ./oleafly-e2e-linux.deb
          pkg="$(dpkg-deb -f oleafly-e2e-linux.deb Package)"
          # Match the app by NAME, never by position. The package installs the
          # engine sidecars beside the app - /usr/bin holds tectonic,
          # tectonic-biber, typst and oleafly - so "the first executable in
          # /usr/bin" is tectonic, and the suite duly launched tectonic as the
          # app and got "required arguments were not provided". The Debian
          # package name and the app binary name are both derived from
          # productName, so match on that and fail loudly rather than guess.
          # Every filter is guarded: an unmatched grep returns 1 under pipefail.
          dpkg -L "$pkg" > installed-files.txt
          echo "--- executables installed by $pkg ---"
          grep -E '^/usr/bin/.' installed-files.txt || echo "(none)"
          app_bin=""
          while IFS= read -r candidate; do
            case "$candidate" in /usr/bin/*) ;; *) continue ;; esac
            [ -f "$candidate" ] && [ -x "$candidate" ] || continue
            base="$(basename "$candidate" | tr '[:upper:]' '[:lower:]')"
            if [ "$base" = "$(printf '%s' "$pkg" | tr '[:upper:]' '[:lower:]')" ]; then
              app_bin="$candidate"
              break
            fi
          done < installed-files.txt
          if [ -z "$app_bin" ]; then
            echo "package $pkg installed no executable named '$pkg' in /usr/bin" >&2
            cat installed-files.txt >&2
            exit 1
          fi
          echo "app binary: $app_bin"
          echo "OLEAFLY_E2E_APP_BINARY=$app_bin" >> "$GITHUB_ENV"

      # Pre-warm still uses the repo's own Tectonic sidecar rather than the one
      # inside the package: both fill the same ~/.cache/Tectonic, and this keeps
      # the warm step independent of where the bundler puts sidecars.
      - name: Cache Tectonic sidecar
        id: cache-tectonic-e2e-linux
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries/tectonic-*
          key: tectonic-${{ runner.os }}-${{ hashFiles('scripts/fetch-tectonic.sh') }}

      - name: Fetch Tectonic sidecar
        if: steps.cache-tectonic-e2e-linux.outputs.cache-hit != 'true'
        run: bash scripts/fetch-tectonic.sh x86_64-unknown-linux-gnu

      - name: Restore Tectonic packages
        id: tectonic-pkgs-linux
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-pkgs-v3-${{ runner.os }}-${{ hashFiles('src-tauri/resources/templates/**/main.tex') }}
          restore-keys: tectonic-pkgs-v3-${{ runner.os }}-

      - name: Pre-warm the Tectonic package cache
        run: |
          BIN="$PWD/src-tauri/binaries/tectonic-x86_64-unknown-linux-gnu"
          mkdir -p /tmp/prewarm
          for f in src-tauri/resources/templates/*/main.tex; do
            (cd "$(dirname "$f")" && "$BIN" -o /tmp/prewarm main.tex) || true
          done

      - name: Save Tectonic packages
        if: steps.tectonic-pkgs-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-pkgs-v3-${{ runner.os }}-${{ hashFiles('src-tauri/resources/templates/**/main.tex') }}

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/ms-playwright
            ~/.cache/ms-playwright
            ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        env:
          DEBUG: pw:install
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the e2e suite
        # WEBKIT_DISABLE_* work around webkit2gtk rendering hangs on the
        # software GL stack xvfb provides.
        # Failure caps match the macOS and Windows lanes: stopping at the first
        # broken spec turns one red run into one round of fixing per spec, and
        # in the green case these caps never fire.
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          E2E_INTERACTION_SEED: ${{ github.event_name != 'schedule' && '62024' || '' }}
        run: xvfb-run -a ./scripts/e2e.sh --shard=${{ matrix.shard }}/4 --suite-max-failures=6 --max-failures=10 --global-timeout=3000000

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-linux-shard-${{ matrix.shard }}
          # Only the small, useful debugging files. Avoids uploading the macOS
          # driver's ~1 GB per-run screencast blob that lives under test-results/.
          path: |
            test-results/**/error-context.md
            test-results/**/trace.zip
            test-results/**/*.log
            e2e-artifacts/**/error-context.md
            e2e-artifacts/**/trace.zip
            e2e-artifacts/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  e2e-windows:
    # The same suite on Windows (WebView2 + Rust + Tectonic). The plugin
    # serves TCP there (no unix sockets); e2e/fixtures.ts connects over TCP
    # via its own fixture, and scripts/e2e.ps1 is the launcher.
    name: E2E (real app, Windows, shard ${{ matrix.shard }}/4)
    needs: [frontend, rust]
    runs-on: windows-2022
    # Sharded like the Linux lane: serially this suite passed 246 tests and was
    # still killed at the ceiling with specs unrun, so the result said nothing.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> src-tauri/target

      - name: Cache Tectonic sidecar
        id: cache-tectonic-e2e-windows
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries/tectonic-*
          key: tectonic-${{ runner.os }}-${{ hashFiles('scripts/fetch-tectonic.sh') }}

      - name: Fetch Tectonic sidecar
        if: steps.cache-tectonic-e2e-windows.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/fetch-tectonic.sh x86_64-pc-windows-msvc

      - name: Cache Biber sidecar
        id: cache-biber-e2e-windows
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries/tectonic-biber-*
          key: biber-${{ runner.os }}-${{ hashFiles('scripts/fetch-biber.sh') }}

      - name: Fetch Biber sidecar
        if: steps.cache-biber-e2e-windows.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/fetch-biber.sh x86_64-pc-windows-msvc

      - name: Cache Typst sidecar
        id: cache-typst-e2e-windows
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries/typst-*
          key: typst-${{ runner.os }}-${{ hashFiles('scripts/fetch-typst.sh') }}

      - name: Fetch Typst sidecar
        if: steps.cache-typst-e2e-windows.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/fetch-typst.sh x86_64-pc-windows-msvc

      - name: Stage checksum-pinned Tinymist resource archive
        shell: bash
        run: node scripts/fetch-language-servers.mjs --server tinymist --target x86_64-pc-windows-msvc --install-mode resource

      - name: Smoke-test Typst sidecar
        shell: bash
        run: bash scripts/smoke-typst.sh x86_64-pc-windows-msvc

      - name: Restore Tectonic packages
        id: tectonic-pkgs-windows
        uses: actions/cache/restore@v6
        with:
          path: ~\AppData\Local\TectonicProject
          key: tectonic-pkgs-v3-${{ runner.os }}-${{ hashFiles('src-tauri/resources/templates/**/main.tex') }}
          restore-keys: tectonic-pkgs-v3-${{ runner.os }}-

      - name: Pre-warm the Tectonic package cache
        shell: bash
        run: |
          BIN="$PWD/src-tauri/binaries/tectonic-x86_64-pc-windows-msvc.exe"
          mkdir -p /tmp/prewarm
          for f in src-tauri/resources/templates/*/main.tex; do
            (cd "$(dirname "$f")" && "$BIN" -o /tmp/prewarm main.tex) || true
          done

      - name: Save Tectonic packages
        if: steps.tectonic-pkgs-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~\AppData\Local\TectonicProject
          key: tectonic-pkgs-v3-${{ runner.os }}-${{ hashFiles('src-tauri/resources/templates/**/main.tex') }}

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/ms-playwright
            ~/.cache/ms-playwright
            ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        env:
          DEBUG: pw:install
        run: pnpm exec playwright install chromium

      - name: Run the e2e suite
        shell: pwsh
        # Same reasoning as the macOS lane: report every failing spec in one
        # run instead of one per round.
        env:
          E2E_INTERACTION_SEED: ${{ github.event_name != 'schedule' && '62024' || '' }}
        run: powershell -File scripts/e2e.ps1 --shard=${{ matrix.shard }}/4 --suite-max-failures=6 --max-failures=10 --global-timeout=3000000

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-windows-shard-${{ matrix.shard }}
          # Only the small, useful debugging files. Avoids uploading the macOS
          # driver's ~1 GB per-run screencast blob that lives under test-results/.
          path: |
            test-results/**/error-context.md
            test-results/**/trace.zip
            test-results/**/*.log
            e2e-artifacts/**/error-context.md
            e2e-artifacts/**/trace.zip
            e2e-artifacts/**/*.log
          retention-days: 7
          if-no-files-found: ignore
