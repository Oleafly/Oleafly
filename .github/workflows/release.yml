name: Release

#
#     git tag v0.1.0 && git push origin v0.1.0
#
# or run manually from the Actions tab (provide the tag to attach to).
#
# A tag build always stops at a complete, verified DRAFT: every platform is
# built and the artifact and updater-feed checks still run, but the release is
# never flipped live. Publishing writes latest.json - the updater feed - which
# installed clients pick up automatically, and that cannot be undone. So it is
# a deliberate second step: re-run this workflow from the Actions tab for the
# same tag with "Publish the release" checked.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build & attach the release to (e.g. v0.1.0)"
        required: true
        type: string
      publish:
        description: "Publish the release. Leave unchecked to build a draft for review."
        required: false
        default: false
        type: boolean

permissions:
  contents: write # tauri-action needs this to create the release & upload assets

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      # The 0.2.8 build graph exceeds Node's default ~4GB heap during vite
      # build on the 7GB macOS arm64 runners.
      NODE_OPTIONS: --max-old-space-size=6144
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            rust_target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - name: Linux (x86_64)
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: ""
          - name: Linux (ARM64)
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            args: "--target aarch64-unknown-linux-gnu"
          - name: Windows (x86_64)
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux system dependencies (Tauri)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            curl wget file

      - name: Install pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          # pnpm 11 requires Node >= 22.13 (see package.json `packageManager`).
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> src-tauri/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate language-server manifest and fetch confinement
        run: pnpm language-servers:test

      # Fetch the Tectonic LaTeX-compiler sidecar for the build target. Tauri
      # bundles it (bundle.externalBin) so the shipped app compiles offline.
      - name: Fetch checksum-pinned Tectonic sidecar
        shell: bash
        run: bash scripts/fetch-tectonic.sh ${{ matrix.rust_target }}

      # Biber 2.17 matched to Tectonic's biblatex; declared as externalBin
      # tectonic-biber. Missing here breaks the Tauri bundler on release.
      - name: Fetch checksum-pinned Biber sidecar
        shell: bash
        run: bash scripts/fetch-biber.sh ${{ matrix.rust_target }}

      - name: Stage checksum-pinned Tinymist resource archive
        shell: bash
        run: node scripts/fetch-language-servers.mjs --server tinymist --target ${{ matrix.rust_target }} --install-mode resource

      # Notarization walks inside bundled archives, and upstream ships Tinymist
      # unsigned. Sign it before Tauri bundles the resource, or the whole app is
      # rejected. No-op on other platforms and on unsigned builds.
      - name: Sign the bundled Tinymist binary (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          SIGN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SIGN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Read straight from secrets rather than the environment: the step
          # that exports APPLE_SIGNING_IDENTITY into $GITHUB_ENV runs after this
          # one, so relying on it meant signing was silently skipped.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGN_APPLE_CERTIFICATE:-}" ]; then
            echo "no signing certificate; leaving the archive as fetched"
            exit 0
          fi
          # tauri-action imports the certificate into a keychain of its own, but
          # that happens in the build step below - after this one. Import into a
          # short-lived keychain here so codesign can resolve the identity now,
          # then remove it and restore the search list so tauri-action's own
          # setup is unaffected.
          KEYCHAIN="$RUNNER_TEMP/oleafly-tinymist.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 24)"
          ORIGINAL_KEYCHAINS="$(security list-keychains -d user | sed 's/["[:space:]]//g' | tr '\n' ' ')"
          cleanup() {
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
            # shellcheck disable=SC2086
            security list-keychains -d user -s $ORIGINAL_KEYCHAINS 2>/dev/null || true
          }
          trap cleanup EXIT
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          CERT="$RUNNER_TEMP/tinymist-signing.p12"
          printf '%s' "$SIGN_APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" \
            -P "$SIGN_APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $ORIGINAL_KEYCHAINS
          node scripts/sign-bundled-tinymist.mjs

      - name: Fetch Typst sidecar
        shell: bash
        run: bash scripts/fetch-typst.sh ${{ matrix.rust_target }}

      - name: Smoke-test Typst sidecar
        shell: bash
        run: bash scripts/smoke-typst.sh ${{ matrix.rust_target }}

      - name: Smoke-test managed Pandoc with packaged Tectonic input
        shell: bash
        run: bash scripts/smoke-markdown.sh ${{ matrix.rust_target }}

      # macOS code signing + notarization. Every APPLE_* value is exported only
      # when its secret exists: an empty env var would make the bundler attempt
      # signing with an empty identity, whereas absent vars mean "unsigned
      # build" (still succeeds, for forks and for before certs are set up).
      # See docs/signing.md for the one-time account/certificate setup.
      - name: Enable macOS signing & notarization (when secrets exist)
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export_env() {
            local name="$1" value="$2"
            [ -n "$value" ] || return 0
            {
              echo "${name}<<OLEAFLY_SECRET_EOF"
              echo "$value"
              echo "OLEAFLY_SECRET_EOF"
            } >> "$GITHUB_ENV"
          }
          export_env APPLE_CERTIFICATE "$SECRET_APPLE_CERTIFICATE"
          export_env APPLE_CERTIFICATE_PASSWORD "$SECRET_APPLE_CERTIFICATE_PASSWORD"
          export_env APPLE_SIGNING_IDENTITY "$SECRET_APPLE_SIGNING_IDENTITY"
          export_env APPLE_ID "$SECRET_APPLE_ID"
          export_env APPLE_PASSWORD "$SECRET_APPLE_PASSWORD"
          export_env APPLE_TEAM_ID "$SECRET_APPLE_TEAM_ID"
          if [ -n "$SECRET_APPLE_CERTIFICATE" ]; then
            export_env KEYCHAIN_PASSWORD "$(openssl rand -hex 24)"
            echo "macOS signing: enabled"
          else
            echo "macOS signing: secrets not set, building unsigned"
          fi

      # Windows Authenticode via Azure Trusted/Artifact Signing (~$10/month,
      # no certificate files to manage). Activated only when the AZURE_*
      # secrets exist; otherwise the build stays unsigned. docs/signing.md
      # covers the Azure account, signing account, and app-registration setup.
      - name: Enable Windows signing (when secrets exist)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          SECRET_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SECRET_AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          SECRET_AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          SECRET_AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if [ -z "$SECRET_AZURE_CLIENT_ID" ]; then
            echo "Windows signing: secrets not set, building unsigned"
            exit 0
          fi
          if [ -z "$SECRET_AZURE_SIGNING_ENDPOINT" ] || [ -z "$SECRET_AZURE_SIGNING_ACCOUNT" ] || [ -z "$SECRET_AZURE_SIGNING_PROFILE" ]; then
            echo "Windows signing: AZURE_CLIENT_ID is set but endpoint/account/profile secrets are missing" >&2
            exit 1
          fi
          cargo install artifact-signing-cli
          printf '{"bundle":{"windows":{"signCommand":"artifact-signing-cli -e %s -a %s -c %s -d Oleafly %%1"}}}' \
            "$SECRET_AZURE_SIGNING_ENDPOINT" "$SECRET_AZURE_SIGNING_ACCOUNT" "$SECRET_AZURE_SIGNING_PROFILE" \
            > src-tauri/tauri.windows-signing.conf.json
          echo 'TAURI_SIGN_ARGS=--config src-tauri/tauri.windows-signing.conf.json' >> "$GITHUB_ENV"
          echo "Windows signing: enabled"

      # Build the release notes from CHANGELOG.md so both the GitHub Release and
      # the updater's `notes` say what changed. tauri-action copies
      # `releaseBody` into `latest.json`.
      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          {
            echo 'body<<CHANGELOG_EOF'
            echo "## What's new in ${VERSION#v}"
            echo ""
            bash scripts/changelog-extract.sh "$VERSION"
            echo ""
            echo "---"
            echo ""
            echo "**Downloads:** grab your platform's installer below (macOS Apple Silicon \`.dmg\`, Windows x86_64 \`.msi\` / \`-setup.exe\`, Linux x86_64 or ARM64 \`.AppImage\` / \`.deb\`)."
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and generates `latest.json`. Set these
          # repo secrets (see docs/updates.md); without them the build still
          # succeeds but produces no auto-update feed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Azure credentials for Windows Authenticode signing; empty when the
          # signing secrets aren't configured (artifact-signing-cli only runs
          # when the signCommand overlay was written by the step above).
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Oleafly ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # Matrix jobs concurrently merge latest.json on the draft release.
          # Retries handle transient delete/upload conflicts; the finalize job
          # below performs a deterministic target-owned merge before release.
          retryAttempts: 3
          args: ${{ matrix.args }} ${{ env.TAURI_SIGN_ARGS }}

      - name: Preserve this target's updater fragment
        uses: actions/upload-artifact@v7
        with:
          name: updater-fragment-${{ matrix.rust_target }}
          path: latest.json
          if-no-files-found: error
          retention-days: 2

      - name: Verify staged compiler sidecars and Tinymist resource policy
        shell: bash
        run: |
          node scripts/fetch-language-servers.mjs --check --server tinymist --target ${{ matrix.rust_target }} --install-mode resource
          if [[ "${{ matrix.rust_target }}" == "aarch64-apple-darwin" || "${{ matrix.rust_target }}" == "aarch64-unknown-linux-gnu" ]]; then
            RUNTIME_DIR="src-tauri/target/${{ matrix.rust_target }}/release"
            test -f "$RUNTIME_DIR/tectonic"
            test ! -e "$RUNTIME_DIR/tinymist"
            test -f "$RUNTIME_DIR/typst"
          elif [[ "${{ matrix.rust_target }}" == *windows* ]]; then
            RUNTIME_DIR="src-tauri/target/release"
            test -f "$RUNTIME_DIR/tectonic.exe"
            test ! -e "$RUNTIME_DIR/tinymist.exe"
            test -f "$RUNTIME_DIR/typst.exe"
          else
            RUNTIME_DIR="src-tauri/target/release"
            test -f "$RUNTIME_DIR/tectonic"
            test ! -e "$RUNTIME_DIR/tinymist"
            test -f "$RUNTIME_DIR/typst"
          fi

  # Each tauri-action leg produces a complete latest.json candidate by merging
  # the release's current manifest. Those read/delete/upload operations are not
  # atomic across a matrix, so the last writer can otherwise lose a concurrent
  # platform. Preserve every leg's local candidate above, then retain only the
  # keys owned by that leg and publish one deterministic manifest after all four
  # builds succeed.
  finalize-updater:
    name: Finalize updater manifest (all targets)
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download per-target updater fragments
        uses: actions/download-artifact@v7
        with:
          pattern: updater-fragment-*
          path: updater-fragments

      - name: Merge target-owned updater entries and upload canonical latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mac="updater-fragments/updater-fragment-aarch64-apple-darwin/latest.json"
          windows="updater-fragments/updater-fragment-x86_64-pc-windows-msvc/latest.json"
          linux_x64="updater-fragments/updater-fragment-x86_64-unknown-linux-gnu/latest.json"
          linux_arm64="updater-fragments/updater-fragment-aarch64-unknown-linux-gnu/latest.json"
          fragments=("$mac" "$windows" "$linux_x64" "$linux_arm64")
          for fragment in "${fragments[@]}"; do
            test -s "$fragment" || { echo "missing updater fragment: $fragment" >&2; exit 1; }
            jq -e '.version and (.platforms | type == "object")' "$fragment" >/dev/null
          done
          metadata_variants="$(jq -c '[.version, .notes]' "${fragments[@]}" | sort -u | wc -l | tr -d ' ')"
          test "$metadata_variants" = 1 || {
            echo "updater fragments disagree on version or release notes" >&2
            exit 1
          }
          jq -n \
            --slurpfile mac "$mac" \
            --slurpfile windows "$windows" \
            --slurpfile linux_x64 "$linux_x64" \
            --slurpfile linux_arm64 "$linux_arm64" '
              def owned($document; $prefix):
                $document.platforms
                | with_entries(select(.key | startswith($prefix)));
              {
                version: $mac[0].version,
                notes: $mac[0].notes,
                pub_date: ([$mac[0].pub_date, $windows[0].pub_date, $linux_x64[0].pub_date, $linux_arm64[0].pub_date] | max),
                platforms: (
                  owned($mac[0]; "darwin-aarch64")
                  + owned($windows[0]; "windows-x86_64")
                  + owned($linux_x64[0]; "linux-x86_64")
                  + owned($linux_arm64[0]; "linux-aarch64")
                )
              }
            ' > latest.json
          for platform in \
            darwin-aarch64 darwin-aarch64-app \
            windows-x86_64 windows-x86_64-msi windows-x86_64-nsis \
            linux-x86_64 linux-x86_64-appimage linux-x86_64-deb \
            linux-aarch64 linux-aarch64-appimage linux-aarch64-deb; do
            jq -e --arg p "$platform" '.platforms | has($p)' latest.json >/dev/null \
              || { echo "merged latest.json is missing platform: $platform" >&2; exit 1; }
          done
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

  provider-live:
    name: Live Anthropic and Google contracts
    if: ${{ inputs.publish == true }}
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Tectonic sidecar
        run: bash scripts/fetch-tectonic.sh aarch64-apple-darwin

      - name: Fetch Biber sidecar
        run: bash scripts/fetch-biber.sh aarch64-apple-darwin

      - name: Fetch Typst sidecar
        run: bash scripts/fetch-typst.sh aarch64-apple-darwin

      - name: Fetch pinned Tinymist resource
        run: node scripts/fetch-language-servers.mjs --server tinymist --target aarch64-apple-darwin --install-mode resource

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> src-tauri/target

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Require live-provider release credentials
        env:
          ANTHROPIC_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$ANTHROPIC_TOKEN" ] || { echo "ANTHROPIC_API_KEY is required to publish" >&2; exit 1; }
          [ -n "$GOOGLE_TOKEN" ] || { echo "GOOGLE_API_KEY is required to publish" >&2; exit 1; }

      - name: Verify Anthropic against the release candidate
        env:
          E2E_AI_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
          E2E_AI_PROVIDER_ID: anthropic
          E2E_AI_MODEL: ${{ vars.ANTHROPIC_E2E_MODEL || 'claude-sonnet-4-20250514' }}
        run: ./scripts/e2e.sh e2e/tests/69-agent-live.spec.ts

      - name: Verify Google against the release candidate
        env:
          E2E_AI_TOKEN: ${{ secrets.GOOGLE_API_KEY }}
          E2E_AI_PROVIDER_ID: google
          E2E_AI_MODEL: ${{ vars.GOOGLE_E2E_MODEL || 'gemini-2.5-pro' }}
        run: ./scripts/e2e.sh e2e/tests/69-agent-live.spec.ts

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-provider-release-test-results
          path: |
            test-results/**/error-context.md
            test-results/**/trace.zip
            test-results/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  # A tag must never yield a half-published release. Each matrix leg uploads its
  # own assets, so a leg that fails simply contributes nothing - which on its own
  # leaves a release carrying only the platforms that happened to succeed. These
  # two jobs make the outcome all-or-nothing.
  # Publishing writes latest.json, which is the updater feed: the moment a
  # release goes live, installed clients can pick it up automatically. There is
  # no undo for that, so pushing a tag builds and verifies a DRAFT and stops.
  # Publishing is a deliberate act - re-run this workflow via workflow_dispatch
  # for the same tag with "Publish the release" checked.
  publish:
    name: Publish (all platforms present)
    needs: [build, finalize-updater, provider-live]
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Require every platform artifact, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          missing=()
          # One representative artifact per supported architecture, plus the
          # updater feed. Architecture-specific names prevent one Linux build
          # from accidentally satisfying both checks.
          grep -qE '\.dmg$'                  <<<"$assets" || missing+=("macOS .dmg")
          grep -qE '\.(msi|exe)$'            <<<"$assets" || missing+=("Windows .msi/.exe")
          grep -qE '_(amd64|x86_64)\.AppImage$' <<<"$assets" || missing+=("Linux x86_64 .AppImage")
          grep -qE '_(arm64|aarch64)\.AppImage$' <<<"$assets" || missing+=("Linux ARM64 .AppImage")
          grep -qE '_(amd64|x86_64)\.deb$'   <<<"$assets" || missing+=("Linux x86_64 .deb")
          grep -qE '_(arm64|aarch64)\.deb$'  <<<"$assets" || missing+=("Linux ARM64 .deb")
          grep -qE '^latest\.json$'          <<<"$assets" || missing+=("latest.json")
          if ((${#missing[@]})); then
            printf 'refusing to publish %s; missing: %s\n' "$TAG" "${missing[*]}" >&2
            exit 1
          fi
          # The updater feed must offer every platform too, or clients on a
          # missing one silently never see the release.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p latest.json -D . --clobber
          for platform in darwin-aarch64 windows-x86_64 linux-x86_64 linux-aarch64; do
            jq -e --arg p "$platform" '.platforms | has($p)' latest.json >/dev/null \
              || { echo "latest.json is missing platform: $platform" >&2; exit 1; }
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "published $TAG with all platform artifacts"

  # A draft handed over for review still has to be complete, so it gets the same
  # artifact and updater-feed checks as a publish - it just never flips live.
  draft-ready:
    name: Draft is complete (not published)
    needs: [build, finalize-updater]
    if: ${{ always() && inputs.publish != true }}
    runs-on: ubuntu-22.04
    permissions:
      # A draft release is only visible to a token with push access, so
      # contents:read cannot see it and `gh release view` fails with
      # "release not found". This job only reads, but write is what makes the
      # draft visible at all.
      contents: write
    steps:
      - name: Require every platform artifact, then stop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs['finalize-updater'].result }}" != "success" ]; then
            echo "build or updater finalization did not succeed; the draft is incomplete" >&2
            exit 1
          fi
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          missing=()
          grep -qE '\.dmg$'                  <<<"$assets" || missing+=("macOS .dmg")
          grep -qE '\.(msi|exe)$'            <<<"$assets" || missing+=("Windows .msi/.exe")
          grep -qE '_(amd64|x86_64)\.AppImage$' <<<"$assets" || missing+=("Linux x86_64 .AppImage")
          grep -qE '_(arm64|aarch64)\.AppImage$' <<<"$assets" || missing+=("Linux ARM64 .AppImage")
          grep -qE '_(amd64|x86_64)\.deb$'   <<<"$assets" || missing+=("Linux x86_64 .deb")
          grep -qE '_(arm64|aarch64)\.deb$'  <<<"$assets" || missing+=("Linux ARM64 .deb")
          grep -qE '^latest\.json$'          <<<"$assets" || missing+=("latest.json")
          if ((${#missing[@]})); then
            printf 'draft %s is incomplete; missing: %s\n' "$TAG" "${missing[*]}" >&2
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p latest.json -D . --clobber
          for platform in darwin-aarch64 windows-x86_64 linux-x86_64 linux-aarch64; do
            jq -e --arg p "$platform" '.platforms | has($p)' latest.json >/dev/null \
              || { echo "latest.json is missing platform: $platform" >&2; exit 1; }
          done
          echo "$TAG is a complete, verified draft; re-run this workflow with publish=true to release it"

  guard-incomplete:
    name: Keep an incomplete release unpublished
    needs: [build, finalize-updater, provider-live, publish]
    if: always() && inputs.publish == true && (needs.build.result != 'success' || needs['finalize-updater'].result != 'success' || needs['provider-live'].result != 'success' || needs.publish.result != 'success')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Force the release back to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true
            echo "kept $TAG as a draft: not every platform produced artifacts"
          fi
          exit 1
