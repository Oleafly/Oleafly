# Weekly grouped dependency updates: one PR per ecosystem instead of a PR per
# package. Security updates are separate (enabled repo-side) and open
# immediately regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait for a release to age before proposing it, so bumps clear pnpm's
    # supply-chain minimum-release-age policy (a just-published version fails
    # `pnpm install --frozen-lockfile` in CI otherwise).
    cooldown:
      default-days: 7
    groups:
      npm-tauri:
        patterns: ["@tauri-apps/*"]
        update-types: ["minor", "patch"]
      npm-xterm:
        patterns: ["@xterm/*"]
      npm-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@codemirror/commands"
        versions: [">=6.11.0"]
      - dependency-name: "@codemirror/view"
        versions: [">=6.43.7"]
      - dependency-name: "@tiptap/*"
        versions: [">=3.30.0"]
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      cargo-tauri:
        patterns: ["tauri", "tauri-*"]
        exclude-patterns: ["tauri-plugin-playwright"]
        update-types: ["minor", "patch"]
      cargo-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-major:
        patterns: ["*"]
        update-types: ["major"]
    open-pull-requests-limit: 5

  # The server's build and runtime images. Installs pin the Compose file per
  # release, so a Caddy fix also needs a new server release to reach them.
  - package-ecosystem: docker
    directory: /crates/oleafly-server
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /deploy/server
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      # The release workflow sets the server's own image tag.
      - dependency-name: "ghcr.io/oleafly/oleafly-server"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-all:
        patterns: ["*"]
    open-pull-requests-limit: 5
