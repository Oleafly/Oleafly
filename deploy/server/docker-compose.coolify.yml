services:
  oleafly-server:
    build:
      context: .
      dockerfile: crates/oleafly-server/Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_URL_OLEAFLY_SERVER_8080
      - OLEAFLY_PUBLIC_URL=${SERVICE_URL_OLEAFLY_SERVER}
      - OLEAFLY_BIND=0.0.0.0:8080
      - OLEAFLY_DATA_DIR=/data
      - OLEAFLY_BEHIND_PROXY=true
      - OLEAFLY_SERVER_NAME=${OLEAFLY_SERVER_NAME:?}
      - OLEAFLY_SERVER_ICON_URL=${OLEAFLY_SERVER_ICON_URL}
      - OLEAFLY_SETUP_CODE=${OLEAFLY_SETUP_CODE}
      - OLEAFLY_GITHUB_CLIENT_ID=${OLEAFLY_GITHUB_CLIENT_ID}
      - OLEAFLY_GITHUB_CLIENT_SECRET=${OLEAFLY_GITHUB_CLIENT_SECRET}
      - OLEAFLY_GITHUB_URL=${OLEAFLY_GITHUB_URL}
      - OLEAFLY_GITHUB_API_URL=${OLEAFLY_GITHUB_API_URL}
      - OLEAFLY_GITHUB_LABEL=${OLEAFLY_GITHUB_LABEL}
      - OLEAFLY_OIDC_UNIVERSITY_ISSUER=${OLEAFLY_OIDC_UNIVERSITY_ISSUER}
      - OLEAFLY_OIDC_UNIVERSITY_CLIENT_ID=${OLEAFLY_OIDC_UNIVERSITY_CLIENT_ID}
      - OLEAFLY_OIDC_UNIVERSITY_CLIENT_SECRET=${OLEAFLY_OIDC_UNIVERSITY_CLIENT_SECRET}
      - OLEAFLY_OIDC_UNIVERSITY_LABEL=${OLEAFLY_OIDC_UNIVERSITY_LABEL}
      - OLEAFLY_OIDC_UNIVERSITY_TRUST_EMAIL=${OLEAFLY_OIDC_UNIVERSITY_TRUST_EMAIL}
      - OLEAFLY_SMTP_URL=${OLEAFLY_SMTP_URL}
      - OLEAFLY_MAIL_FROM=${OLEAFLY_MAIL_FROM}
      - OLEAFLY_BLOB_STORE=${OLEAFLY_BLOB_STORE:-fs}
      - OLEAFLY_MAX_PROJECT_MB=${OLEAFLY_MAX_PROJECT_MB:-200}
      - OLEAFLY_MAX_FILE_MB=${OLEAFLY_MAX_FILE_MB:-50}
      - OLEAFLY_MAX_MEMBERS_PER_PROJECT=${OLEAFLY_MAX_MEMBERS_PER_PROJECT:-20}
      - OLEAFLY_LOG_LEVEL=${OLEAFLY_LOG_LEVEL:-info}
      - OLEAFLY_SECURITY_LOG_DAYS=${OLEAFLY_SECURITY_LOG_DAYS:-365}
      - OLEAFLY_ARCHIVE_DAYS=${OLEAFLY_ARCHIVE_DAYS:-30}
    volumes:
      - oleafly-data:/data

volumes:
  oleafly-data:
