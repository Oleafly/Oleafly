<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/leaf.svg" />
    <!-- Keep splash styles external. Tauri adds a style-src nonce whenever it
         sees an inline <style>; CSP then rejects CodeMirror's runtime styles. -->
    <link rel="stylesheet" href="/src/styles/splash.css" />
    <title>Oleafly</title>
    <script>
      // Resolve the theme before first paint so both the app shell and the
      // splash render in the user's palette (no dark flash for light-theme
      // users and vice versa). Must stay dependency-free and synchronous.
      (function () {
        var theme = "dark";
        var locale = "en";
        try {
          var stored = localStorage.getItem("oleafly.theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
          ) {
            theme = "light";
          }
          var shipped = ["en", "zh-Hans", "zh-Hant", "de", "fr", "es", "it", "nl", "pt-BR", "pl", "ru", "uk", "tr", "cs", "da", "sv", "nb", "fi", "ro", "ja", "ko"];
          var aliases = { "zh-Hant": "zh-Hans", "pt": "pt-BR", "pt-PT": "pt-BR", "no": "nb", "nn": "nb" };
          var resolveTag = function (tag) {
            var parts = String(tag || "").toLowerCase().split(/[.@]/)[0].split(/[-_]/).filter(Boolean);
            var language = parts[0];
            if (!language) return null;
            var canonical = language;
            if (language === "zh") {
              canonical = /hant|tw|hk|mo/.test(parts.slice(1).join("-")) ? "zh-Hant" : "zh-Hans";
            } else {
              for (var i = 1; i < parts.length; i += 1) {
                if (/^[a-z]{2}$/.test(parts[i])) { canonical = language + "-" + parts[i].toUpperCase(); break; }
              }
            }
            var candidates = [canonical, language];
            for (var j = 0; j < candidates.length; j += 1) {
              if (shipped.indexOf(candidates[j]) >= 0) return candidates[j];
              var alias = aliases[candidates[j]];
              if (alias && shipped.indexOf(alias) >= 0) return alias;
            }
            return null;
          };
          var preference = localStorage.getItem("oleafly.locale");
          if (shipped.indexOf(preference) >= 0) {
            locale = preference;
          } else if (preference === null || preference === "system") {
            locale = resolveTag(navigator.language) || locale;
          }
        } catch (e) {
          /* storage unavailable: keep defaults */
        }
        document.documentElement.className = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.lang = locale;
        window.__oleaflyBootLocale = locale;
      })();
    </script>
  </head>
  <body>
    <div id="oleafly-splash" role="status" aria-label="Starting Oleafly">
      <div class="oleafly-splash-logo" aria-hidden="true">
        <svg class="oleafly-splash-track" viewBox="0 0 24 24">
          <path d="M21 2C6 2 4 16 3 22h1.998c.666-3.333 2.333-5.166 5.002-5.5 4-.5 7-4 8-7l-1.5-1 1-1c1-1 2.004-2.5 3.5-5.5z" />
        </svg>
        <svg class="oleafly-splash-fill" viewBox="0 0 24 24">
          <path d="M21 2C6 2 4 16 3 22h1.998c.666-3.333 2.333-5.166 5.002-5.5 4-.5 7-4 8-7l-1.5-1 1-1c1-1 2.004-2.5 3.5-5.5z" fill="#34B44A" />
        </svg>
      </div>
      <div id="oleafly-splash-stage" class="oleafly-splash-stage">Initializing Oleafly</div>
    </div>
    <script>
      // Boot-stage narration. Real boot progress (boot-telemetry.ts) advances
      // the text the moment a stage is reached; a 1s fallback timer keeps it
      // moving on slow starts so the splash never looks frozen. The index is
      // monotonic: progress signals can only move the text forward.
      (function () {
        var narration = {
          "en": {
            "stages": [
              "Initializing Oleafly",
              "Loading Oleafly Core",
              "Loading Oleafly Harness",
              "Loading Oleafly Parsers"
            ],
            "starting": "Starting Oleafly"
          },
          "zh-Hans": {
            "stages": [
              "正在初始化 Oleafly",
              "正在加载 Oleafly Core",
              "正在加载 Oleafly Harness",
              "正在加载 Oleafly Parsers"
            ],
            "starting": "正在启动 Oleafly"
          },
          "zh-Hant": {
            "stages": [
              "正在初始化 Oleafly",
              "正在載入 Oleafly Core",
              "正在載入 Oleafly Harness",
              "正在載入 Oleafly Parsers"
            ],
            "starting": "正在啟動 Oleafly"
          },
          "de": {
            "stages": [
              "Oleafly wird vorbereitet",
              "Oleafly Core wird geladen",
              "Oleafly Harness wird geladen",
              "Oleafly Parsers werden geladen"
            ],
            "starting": "Oleafly startet"
          },
          "fr": {
            "stages": [
              "Initialisation d'Oleafly",
              "Chargement d'Oleafly Core",
              "Chargement d'Oleafly Harness",
              "Chargement d'Oleafly Parsers"
            ],
            "starting": "Démarrage d'Oleafly"
          },
          "es": {
            "stages": [
              "Iniciando Oleafly",
              "Cargando Oleafly Core",
              "Cargando Oleafly Harness",
              "Cargando Oleafly Parsers"
            ],
            "starting": "Arrancando Oleafly"
          },
          "it": {
            "stages": [
              "Inizializzazione di Oleafly",
              "Caricamento di Oleafly Core",
              "Caricamento di Oleafly Harness",
              "Caricamento di Oleafly Parsers"
            ],
            "starting": "Avvio di Oleafly"
          },
          "nl": {
            "stages": [
              "Oleafly initialiseren",
              "Oleafly Core laden",
              "Oleafly Harness laden",
              "Oleafly Parsers laden"
            ],
            "starting": "Oleafly starten"
          },
          "pt-BR": {
            "stages": [
              "Inicializando o Oleafly",
              "Carregando o núcleo do Oleafly",
              "Carregando o ambiente do Oleafly",
              "Carregando os analisadores do Oleafly"
            ],
            "starting": "Iniciando o Oleafly"
          },
          "pl": {
            "stages": [
              "Inicjowanie Oleafly",
              "Wczytywanie Oleafly Core",
              "Wczytywanie Oleafly Harness",
              "Wczytywanie Oleafly Parsers"
            ],
            "starting": "Uruchamianie Oleafly"
          },
          "ru": {
            "stages": [
              "Инициализация Oleafly",
              "Загрузка ядра Oleafly",
              "Загрузка оснастки Oleafly",
              "Загрузка парсеров Oleafly"
            ],
            "starting": "Запуск Oleafly"
          },
          "uk": {
            "stages": [
              "Ініціалізація Oleafly",
              "Завантаження Oleafly Core",
              "Завантаження Oleafly Harness",
              "Завантаження Oleafly Parsers"
            ],
            "starting": "Запуск Oleafly"
          },
          "tr": {
            "stages": [
              "Oleafly başlatılıyor",
              "Oleafly Core yükleniyor",
              "Oleafly Harness yükleniyor",
              "Oleafly Parsers yükleniyor"
            ],
            "starting": "Oleafly açılıyor"
          },
          "cs": {
            "stages": [
              "Inicializuje se Oleafly",
              "Načítá se Oleafly Core",
              "Načítá se Oleafly Harness",
              "Načítají se Oleafly Parsers"
            ],
            "starting": "Spouští se Oleafly"
          },
          "da": {
            "stages": [
              "Initialiserer Oleafly",
              "Indlæser Oleafly Core",
              "Indlæser Oleafly Harness",
              "Indlæser Oleafly Parsers"
            ],
            "starting": "Starter Oleafly"
          },
          "sv": {
            "stages": [
              "Initierar Oleafly",
              "Läser in Oleafly Core",
              "Läser in Oleafly Harness",
              "Läser in Oleafly Parsers"
            ],
            "starting": "Startar Oleafly"
          },
          "nb": {
            "stages": [
              "Starter opp Oleafly",
              "Laster Oleafly Core",
              "Laster Oleafly Harness",
              "Laster Oleafly Parsers"
            ],
            "starting": "Starter Oleafly"
          },
          "fi": {
            "stages": [
              "Alustetaan Oleaflyä",
              "Ladataan Oleafly Corea",
              "Ladataan Oleafly Harnessia",
              "Ladataan Oleafly Parsersia"
            ],
            "starting": "Käynnistetään Oleaflyä"
          },
          "ro": {
            "stages": [
              "Se inițializează Oleafly",
              "Se încarcă nucleul Oleafly",
              "Se încarcă structura Oleafly",
              "Se încarcă analizatoarele Oleafly"
            ],
            "starting": "Pornește Oleafly"
          },
          "ja": {
            "stages": [
              "Oleafly を初期化しています",
              "Oleafly Core を読み込んでいます",
              "Oleafly Harness を読み込んでいます",
              "Oleafly Parsers を読み込んでいます"
            ],
            "starting": "Oleafly を起動しています"
          },
          "ko": {
            "stages": [
              "Oleafly를 초기화하는 중",
              "Oleafly Core를 불러오는 중",
              "Oleafly Harness를 불러오는 중",
              "Oleafly Parsers를 불러오는 중"
            ],
            "starting": "Oleafly를 시작하는 중"
          }
        };
        var texts = narration[window.__oleaflyBootLocale] || narration.en;
        var stages = texts.stages;
        var current = 0;
        function apply() {
          var el = document.getElementById("oleafly-splash-stage");
          if (el) el.textContent = stages[current];
        }
        var splash = document.getElementById("oleafly-splash");
        if (splash) splash.setAttribute("aria-label", texts.starting);
        apply();
        window.__oleaflySplashStage = function (index) {
          if (typeof index !== "number" || index <= current) return;
          current = Math.min(index, stages.length - 1);
          apply();
        };
        window.__oleaflySplashTimer = setInterval(function () {
          if (!document.getElementById("oleafly-splash")) {
            clearInterval(window.__oleaflySplashTimer);
            return;
          }
          if (current < stages.length - 1) {
            current += 1;
            apply();
          }
        }, 1000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
