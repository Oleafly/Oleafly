<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/leaf.svg" />
    <!-- Keep splash styles external. Tauri adds a style-src nonce whenever it
         sees an inline <style>; CSP then rejects CodeMirror's runtime styles. -->
    <link rel="stylesheet" href="/src/styles/splash.css" />
    <title>Oleafly</title>
    <script>
      // Resolve the theme before first paint so both the app shell and the
      // splash render in the user's palette (no dark flash for light-theme
      // users and vice versa). Must stay dependency-free and synchronous.
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("oleafly.theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
          ) {
            theme = "light";
          }
        } catch (e) {
          /* storage unavailable: keep dark */
        }
        document.documentElement.className = theme;
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="oleafly-splash" role="status" aria-label="Starting Oleafly">
      <div class="oleafly-splash-logo" aria-hidden="true">
        <svg class="oleafly-splash-track" viewBox="0 0 24 24">
          <path d="M21 2C6 2 4 16 3 22h1.998c.666-3.333 2.333-5.166 5.002-5.5 4-.5 7-4 8-7l-1.5-1 1-1c1-1 2.004-2.5 3.5-5.5z" />
        </svg>
        <svg class="oleafly-splash-fill" viewBox="0 0 24 24">
          <path d="M21 2C6 2 4 16 3 22h1.998c.666-3.333 2.333-5.166 5.002-5.5 4-.5 7-4 8-7l-1.5-1 1-1c1-1 2.004-2.5 3.5-5.5z" fill="#34B44A" />
        </svg>
      </div>
      <div id="oleafly-splash-stage" class="oleafly-splash-stage">Initializing Oleafly</div>
    </div>
    <script>
      // Boot-stage narration. Real boot progress (boot-telemetry.ts) advances
      // the text the moment a stage is reached; a 1s fallback timer keeps it
      // moving on slow starts so the splash never looks frozen. The index is
      // monotonic: progress signals can only move the text forward.
      (function () {
        var stages = [
          "Initializing Oleafly",
          "Loading Oleafly Core",
          "Loading Oleafly Harness",
          "Loading Oleafly Parsers",
        ];
        var current = 0;
        function apply() {
          var el = document.getElementById("oleafly-splash-stage");
          if (el) el.textContent = stages[current];
        }
        window.__oleaflySplashStage = function (index) {
          if (typeof index !== "number" || index <= current) return;
          current = Math.min(index, stages.length - 1);
          apply();
        };
        window.__oleaflySplashTimer = setInterval(function () {
          if (!document.getElementById("oleafly-splash")) {
            clearInterval(window.__oleaflySplashTimer);
            return;
          }
          if (current < stages.length - 1) {
            current += 1;
            apply();
          }
        }, 1000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
