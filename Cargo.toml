[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

[workspace.dependencies]
tempfile = "3.27"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# The desktop bundle is built for size, but the collaboration server spends
# its time on JSON, base64 and document replays, so its own code is built
# for speed.
[profile.release.package.oleafly-server]
opt-level = 3

# The server image and its release binaries are built with this profile.
# Most of the server's work happens in its dependencies (Loro, serde_json,
# base64, SQLite), so they are built for speed too, not only its own code.
[profile.server-release]
inherits = "release"
opt-level = 3

[profile.server-release.package."*"]
opt-level = 3

# The browser app's SyncTeX WebAssembly (crates/oleafly-synctex-wasm, built
# by scripts/build-synctex-wasm.mjs). Every reader downloads it, so it is
# built for size, and a panic aborts instead of carrying unwinding code.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The upstream bridge resolves windows through `webview_windows()`, which
# drops a window the moment it hosts a second webview (the browser dock), so
# every eval after opening the dock failed with "window not found". The
# vendored copy resolves through the webview map instead.
[patch.crates-io]
tauri-plugin-playwright = { path = "vendor/tauri-plugin-playwright" }
portable-pty = { path = "vendor/portable-pty" }
tauri-plugin-single-instance = { path = "vendor/tauri-plugin-single-instance" }
