sonar.projectName=Oleafly
sonar.sourceEncoding=UTF-8

# Analyze application and supporting build/tooling code. Generated assets,
# downloaded sidecars, and documentation are outside this explicit scope.
sonar.sources=src,packages,crates,src-tauri/src,src-tauri/build.rs,scripts
sonar.tests=src,packages,crates,src-tauri/src,scripts,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.node-tests.mjs,**/tests.rs,**/tests/**,e2e/**/*.ts,e2e/**/*.tsx,e2e/**/*.mjs

# CI produces these reports before the scanner runs.
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
sonar.rust.lcov.reportPaths=coverage/rust/lcov.info

# Build and tooling scripts stay in sonar.sources so their bugs and
# vulnerabilities are still reported, but they are excluded from coverage.
# What tests they have run under `node --test`, which emits no lcov, so the
# scanner would otherwise count every line as uncovered and drag the
# new-code coverage gate down on any change that touches tooling.
#
# The Rust coverage job runs on Linux, so it compiles the Linux-only GTK glue
# (src-tauri/src/**/linux_gtk.rs) but can never run it: those files only wire
# GTK and WebKitGTK signals on a live webview inside a GTK main loop, which a
# headless unit-test runner does not have. The Windows and macOS glue never
# counts because it is not compiled there. The decisions those files make
# (edge hit-testing, when corners round, drop bookkeeping, shortcut matching,
# the browser pane rectangle) live beside them in plain functions with unit
# tests, and the glue itself is checked on a real Linux desktop.
sonar.coverage.exclusions=scripts/**,src/developer/**,src/main.tsx,src/lib/e2e-probe.ts,src/lib/e2e-import-registry.ts,src-tauri/src/**/linux_gtk.rs

# The interface catalog types are generated from the English catalogs by
# `pnpm i18n:types` and checked for freshness in CI; the file is one nested
# type literal with nothing for the analyzer to find.
sonar.exclusions=src/i18n/resources-types.d.ts,vendor/**

# The provider, model, and research-seed registries are declarative data tables
# whose entries all share one shape (id, name, base URL, model list; or slug,
# name, engine, main document, color). Copy-paste detection anonymizes literals,
# so it reads every catalog row as a clone of its neighbors and fails the
# duplication gate whenever the catalogs are updated. Correctness of these
# tables is guarded by catalog-parity.test.ts and research-seed-catalog.test.ts
# instead, which check the entries against the Rust catalog and against the
# fixture directories on disk. The conversion registry is the same kind of
# table (id, label, blurb, source, target, direction, engine, status, surface);
# index.test.ts checks its ids, its pandoc routes against the Rust plan table,
# and that docs/conversion-matrix.md is regenerated from it.
sonar.cpd.exclusions=packages/ai-core/src/providers.ts,crates/oleafly-agent/src/provider.rs,src/developer/research-seed-catalog.ts,src/components/ai/AiToolsList.tsx,packages/conversion-registry/src/index.ts

# The existing Rust CI job already runs Clippy with warnings denied. Running it
# again inside the scanner would duplicate work without adding a distinct gate.
sonar.rust.clippy.enabled=false
sonar.rust.cargo.manifestPaths=Cargo.toml

# Rust keeps unit tests in inline `#[cfg(test)] mod tests { ... }` modules at
# the tail of each source file. Test detection here is path based
# (sonar.test.inclusions), so those modules are analyzed as production code and
# their fixtures (tar headers with real-world modes, scratch files with
# executable bits) trip security rules such as rust:S2612. Stop analyzing from
# the module's opening line to the end of the file; an empty end regexp extends
# the block to EOF. The marker is the `mod tests {` line rather than the
# `#[cfg(test)]` attribute because that attribute also gates single items early
# in some files, which would hide production code. Backslashes are doubled
# because the scanner reads this file with Java properties escaping.
sonar.issue.ignore.block=rustInlineTests
sonar.issue.ignore.block.rustInlineTests.beginBlockRegexp=^\\s*(?:pub(?:\\(crate\\))?\\s+)?mod \\w*tests\\s*\\{\\s*$
sonar.issue.ignore.block.rustInlineTests.endBlockRegexp=
