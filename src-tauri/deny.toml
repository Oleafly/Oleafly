# cargo-deny policy for the full Rust workspace.
# Run from the repository root:
# cargo deny --workspace --all-features --config src-tauri/deny.toml check

[graph]
all-features = true

[advisories]
yanked = "warn"
# Everything ignored below is transitively pinned by Tauri itself and has no
# upstream fix we can adopt; Dependabot resurfaces them when Tauri moves.
ignore = [
  # proc-macro-error unmaintained (via gtk3 macro stack).
  "RUSTSEC-2024-0370",
  # paste unmaintained; a build-time proc-macro required by biblatex and by
  # statrs' nalgebra chain. No vulnerability, no maintained replacement the
  # upstream crates have moved to.
  "RUSTSEC-2024-0436",
  # unic-* unmaintained (transitive; no maintained replacement in the chain).
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
  { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is unmaintained, reached only through loro via postcard and heapless; no vulnerability and no upgrade in that chain" },
  { id = "RUSTSEC-2026-0247", reason = "bitmaps is unmaintained, reached only through loro via im; no vulnerability and no upgrade in that chain" },
  { id = "RUSTSEC-2026-0248", reason = "im is unmaintained, used by loro-internal for persistent maps; no vulnerability and no upgrade in that chain" },
  { id = "RUSTSEC-2026-0251", reason = "sized-chunks is unmaintained, reached only through loro via im; no vulnerability and no upgrade in that chain" },
  { id = "RUSTSEC-2026-0367", reason = "zip extract() keeps SUID/SGID bits on Unix; tauri-plugin-updater pins zip ^4 through 2.14 and 3.0 alpha and extracts only signature-checked update zips on Windows, and our own zip code never calls extract(); harper-core (spelling and grammar in `oleafly lint`) links zip 8 for rule packs the CLI never loads and never calls extract()" },
  { id = "RUSTSEC-2026-0368", reason = "zip extract() writes symlinks that point outside the target; tauri-plugin-updater pins zip ^4 through 2.14 and 3.0 alpha and extracts only signature-checked update zips on Windows, and our own zip code never calls extract(); harper-core (spelling and grammar in `oleafly lint`) links zip 8 for rule packs the CLI never loads and never calls extract()" },
  { id = "RUSTSEC-2026-0369", reason = "zip extract() sets Unix permissions through symlinks; tauri-plugin-updater pins zip ^4 through 2.14 and 3.0 alpha and extracts only signature-checked update zips on Windows, and our own zip code never calls extract(); harper-core (spelling and grammar in `oleafly lint`) links zip 8 for rule packs the CLI never loads and never calls extract()" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant is no longer released on its own (it moved into zbus 6); reached only through tauri-plugin-single-instance, which pins zbus ^5.9 through 2.5.4 and 3.0 alpha; no vulnerability" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names is no longer released on its own (it moved into zbus 6); reached only through tauri-plugin-single-instance, which pins zbus ^5.9 through 2.5.4 and 3.0 alpha; no vulnerability" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is no longer released on its own (its macros moved into zbus 6); reached only through tauri-plugin-single-instance, which pins zbus ^5.9 through 2.5.4 and 3.0 alpha; no vulnerability" },
  { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained; reached only through burn, the model behind harper-core's part-of-speech tagging (spelling and grammar in `oleafly lint`); no vulnerability and no release of that chain without it" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; reached only through lopdf, which preflight uses to read the fonts of a built PDF and pdf-extract uses to read the text of papers; no vulnerability and no lopdf release without it" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "0BSD",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-acp" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-agent" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-cli" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-collab" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-collab-protocol" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-core" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-doctools" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-downloads" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-forge" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-history" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-lint" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-online" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-preflight" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-research" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-s3" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-sandbox" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-secrets" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-server" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-synctex" },
  { allow = ["AGPL-3.0-or-later"], crate = "oleafly-synctex-wasm" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
