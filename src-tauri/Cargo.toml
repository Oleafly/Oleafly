[package]
name = "oleafly"
version = "0.4.5"
description = "Oleafly - the intelligent research workspace, free, local-first, 100% open source"
authors = ["Prajwal Murthy and contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.89"
default-run = "oleafly"

[lib]
name = "oleafly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aho-corasick = "1"
oleafly-agent = { path = "../crates/oleafly-agent" }
oleafly-cli = { path = "../crates/oleafly-cli" }
oleafly-core = { path = "../crates/oleafly-core" }
oleafly-history = { path = "../crates/oleafly-history" }
# `unstable` unlocks the multi-webview APIs (Window::add_child) that the
# browser window uses for its toolbar and tabs. It also makes every window's
# webview a child webview; webview_frame.rs and webview_focus.rs cover that.
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tokio = { version = "1", features = ["time", "sync", "macros", "process", "io-util", "fs", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tauri-plugin-shell = "2"
tauri-plugin-playwright = { version = "0.4", optional = true }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
sys-locale = "0.3"
# In-app auto-update: checks the GitHub Releases `latest.json`, verifies the
# minisign signature against the pubkey in tauri.conf.json, and installs. The
# process plugin provides `relaunch()` to restart into the new version.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "1.1"
unicode-normalization = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
portable-pty = "0.9"
base64 = "0.23"
window-vibrancy = "0.8"
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
zip = { version = "7", default-features = false, features = ["deflate"] }
# Extracting the Linux pandoc tarball on-demand (macOS/Windows ship a zip).
tar = "0.4"
# Streaming the pandoc download so we can report progress.
futures-util = "0.3"
fs4 = "1.1"
atomicwrites = "0.4"
sha2 = "0.10"
# Compresses the before-turn copies kept for Undo (already used by oleafly-history).
zstd = "0.14"
# Async HTTP client for GitHub OAuth, repository operations, and public
# repository metadata. These requests stay in Rust so tokens never enter the
# webview and the CSP does not need to allow GitHub API origins.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rand = "0.8"
ring = "0.17"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
argon2 = "0.6"
aes = { version = "0.9", features = ["zeroize"] }
cbc = { version = "0.2", features = ["zeroize"] }
zeroize = "=1.9.0"
libc = "0.2"
dirs = "7"
serde_yaml = "0.9"
same-file = "1"
tempfile = { workspace = true }
biblatex = "0.12.0"
icu_properties = "2.2"
statrs = "0.19.1"
rapidfuzz = "0.5.0"
muda = { version = "0.21", default-features = false }
notify = "8.2"
trash = "5.2.9"
fontdb = "0.24"
skrifa = { version = "0.48", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSGeometry", "objc2-core-foundation"] }
# Lets AppKit size the WKWebView of Oleafly's own windows (webview_frame.rs).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSResponder", "NSView", "NSWindow"] }
dispatch2 = "0.3"
plist = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-registry = "0.100"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[target.'cfg(not(windows))'.dependencies]
# Streaming decoder for TinyTeX's official Linux ARM64 .tar.xz. Static linking
# avoids a runtime liblzma dependency; disabling defaults avoids bindgen.
liblzma = { version = "=0.4.8", default-features = false, features = ["static"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# E2E automation bridge (Playwright socket server); never in release builds.
e2e-testing = ["dep:tauri-plugin-playwright"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
plist = "1"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }
