[package]
name = "oleafly"
version = "0.3.13"
description = "Oleafly - the intelligent research workspace, free, local-first, 100% open source"
authors = ["Prajwal Murthy and contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "oleafly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aho-corasick = "1"
oleafly-agent = { path = "../crates/oleafly-agent" }
oleafly-core = { path = "../crates/oleafly-core" }
oleafly-history = { path = "../crates/oleafly-history" }
# `unstable` unlocks the multi-webview APIs (Webview class) that power the
# composer's embedded browser pane; supported on macOS, Windows, and Linux.
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tokio = { version = "1", features = ["time", "sync", "macros", "process", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tauri-plugin-shell = "2"
tauri-plugin-playwright = { version = "0.4", optional = true }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
# In-app auto-update: checks the GitHub Releases `latest.json`, verifies the
# minisign signature against the pubkey in tauri.conf.json, and installs. The
# process plugin provides `relaunch()` to restart into the new version.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.9"
base64 = "0.23"
window-vibrancy = "0.6"
cap-fs-ext = "=4.0.2"
cap-std = "=4.0.3"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
# Extracting the Linux pandoc tarball on-demand (macOS/Windows ship a zip).
tar = "0.4"
# Streaming the pandoc download so we can report progress.
futures-util = "0.3"
fs4 = "1.1"
atomicwrites = "0.4"
sha2 = "0.10"
# Async HTTP client for GitHub OAuth, repository operations, and public
# repository metadata. These requests stay in Rust so tokens never enter the
# webview and the CSP does not need to allow GitHub API origins.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rand = "0.8"
ring = "0.17"
argon2 = "0.5"
aes = { version = "0.8", features = ["zeroize"] }
cbc = { version = "0.1", features = ["zeroize"] }
zeroize = "=1.9.0"
libc = "0.2"
serde_yaml = "0.9"
same-file = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=2.11.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Streaming decoder for TinyTeX's official Linux ARM64 .tar.xz. Static linking
# avoids a runtime liblzma dependency; disabling defaults avoids bindgen.
liblzma = { version = "=0.4.8", default-features = false, features = ["static"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# E2E automation bridge (Playwright socket server); never in release builds.
e2e-testing = ["dep:tauri-plugin-playwright"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = { workspace = true }
