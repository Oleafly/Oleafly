[package]
name = "oleafly"
version = "0.4.9"
description = "Oleafly - the intelligent research workspace, free, local-first, 100% open source"
authors = ["Prajwal Murthy and contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.89"
default-run = "oleafly"

[lib]
name = "oleafly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aho-corasick = "1"
oleafly-agent = { path = "../crates/oleafly-agent" }
oleafly-cli = { path = "../crates/oleafly-cli", features = ["proofread"] }
oleafly-collab = { path = "../crates/oleafly-collab" }
oleafly-collab-protocol = { path = "../crates/oleafly-collab-protocol" }
oleafly-core = { path = "../crates/oleafly-core" }
oleafly-s3 = { path = "../crates/oleafly-s3" }
oleafly-history = { path = "../crates/oleafly-history" }
# `unstable` unlocks the multi-webview APIs. The in-app browser that needed
# them is gone; dropping the feature is a separate change (it changes how
# every window hosts its webview). webview_frame.rs and webview_focus.rs cover
# the child webview it gives every window.
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tokio = { version = "1", features = ["time", "sync", "macros", "process", "io-util", "fs", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tauri-plugin-shell = "2"
tauri-plugin-playwright = { version = "0.4", optional = true }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
sys-locale = "0.3"
# In-app auto-update: checks the GitHub Releases `latest.json`, verifies the
# minisign signature against the pubkey in tauri.conf.json, and installs. The
# process plugin provides `relaunch()` to restart into the new version.
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2"
tauri-plugin-notification = "2.4"
tauri-plugin-single-instance = { version = "2.4.5", features = ["deep-link"] }
tauri-plugin-deep-link = "~2.4.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
# Package names follow Typst's identifier rule (XID_Start, XID_Continue).
unicode-ident = "1"
unicode-normalization = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.9"
base64 = "0.23"
png = "0.18"
window-vibrancy = "0.8"
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
zip = { version = "9.1", default-features = false, features = ["deflate"] }
# Extracting the Linux pandoc tarball on-demand (macOS/Windows ship a zip).
tar = "0.4"
# Streaming the pandoc download so we can report progress.
futures-util = "0.3"
fs4 = "1.1"
atomicwrites = "0.4"
sha2 = "0.10"
# Compresses the before-turn copies kept for Undo (already used by oleafly-history).
zstd = "0.14"
# Async HTTP client for Git hosting sign-in, repository operations, and public
# repository metadata. These requests stay in Rust so tokens never enter the
# webview and the CSP does not need to allow Git server origins. Native roots
# so corporate certificate authorities work.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "stream"] }
rand = "0.8"
async-trait = "0.1"
keyring-core = "1"
ring = "0.17"
roxmltree = "0.20"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
argon2 = "0.5"
aes = { version = "0.9", features = ["zeroize"] }
cbc = { version = "0.2", features = ["zeroize"] }
zeroize = "=1.9.0"
libc = "0.2"
dirs = "6"
serde_norway = "0.9"
same-file = "1"
tempfile = { workspace = true }
biblatex = "0.12.0"
icu_properties = "2.2"
statrs = "0.18.0"
rapidfuzz = "0.5.0"
muda = { version = "0.20", default-features = false }
notify = "8.2"
open = "5"
trash = "5.2.9"
fontdb = "0.24"
skrifa = { version = "0.48", default-features = false, features = ["std"] }
# 0.4.8 F2
oleafly-secrets = { path = "../crates/oleafly-secrets", features = ["keychain"] }
oleafly-online = { path = "../crates/oleafly-online" }
# 0.4.8 E
oleafly-sandbox = { path = "../crates/oleafly-sandbox" }
oleafly-research = { path = "../crates/oleafly-research" }
# 0.4.8 D
oleafly-acp = { path = "../crates/oleafly-acp" }
# 0.4.8 G
oleafly-forge = { path = "../crates/oleafly-forge" }
# 0.4.8 F1
oleafly-doctools = { path = "../crates/oleafly-doctools" }
oleafly-downloads = { path = "../crates/oleafly-downloads" }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
security-framework = "=2.11.1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSGeometry", "NSData", "NSDictionary", "NSArray", "NSEnumerator", "objc2-core-foundation"] }
# Lets AppKit size the WKWebView of Oleafly's own windows (webview_frame.rs),
# draw installed apps' icons for the Computer Use app picker, and find the
# allowed apps that run.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSResponder", "NSView", "NSWindow", "NSApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSWorkspace", "NSRunningApplication", "libc"] }
dispatch2 = "0.3"
plist = "1"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
# The same versions wry uses: the controller it hands to with_webview has to
# be the type webview_focus.rs takes.
webview2-com = "0.39"
windows-core = "0.62"
windows-registry = "0.6"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[target.'cfg(not(windows))'.dependencies]
# Streaming decoder for TinyTeX's official Linux ARM64 .tar.xz. Static linking
# avoids a runtime liblzma dependency; disabling defaults avoids bindgen.
liblzma = { version = "=0.4.8", default-features = false, features = ["static"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# E2E automation bridge (Playwright socket server); never in release builds.
e2e-testing = ["dep:tauri-plugin-playwright", "oleafly-collab/e2e-hooks"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
plist = "1"
oleafly-server = { path = "../crates/oleafly-server", features = ["test-support"] }
oleafly-research = { path = "../crates/oleafly-research", features = ["test-support"] }
oleafly-downloads = { path = "../crates/oleafly-downloads", features = ["test-support"] }
oleafly-online = { path = "../crates/oleafly-online", features = ["test-support"] }
oleafly-forge = { path = "../crates/oleafly-forge", features = ["test-support"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }
