packages:
  - "packages/*"

allowBuilds:
  esbuild: true

# Force the transitive nanoid (via hunspell-asm) to a patched version.
# GHSA-mwcw-c2x4-8c55: predictable results in nanoid < 3.3.8.
# GHSA-2v37-7h3g-55p8: custom generators loop forever on size zero, < 3.3.18.
# Force transitive build and test dependencies to patched versions.
overrides:
  "rehype-katex>katex": "0.18.1"
  nanoid@<3.3.18: "3.3.18"
  # GHSA-6g55-p6wh-862q: source map disclosure in postcss < 8.5.23.
  postcss@<8.5.23: "8.5.23"
  # GHSA-g9mf-h72j-4rw9 and related advisories fixed in undici 7.29.0.
  undici@<7.29.0: "7.29.0"
  # GHSA-c4c3-pg64-4m4v, GHSA-6x64-9x62-f2gx,
  # GHSA-3rrr-jr9j-h3q3, GHSA-2v8p-3f2j-5mp7, GHSA-rhh3-jpg6-66xh.
  mermaid@<11.16.1: "11.16.1"
  # GHSA-55q2-fjhq-7xh7: detached DOM subtree XSS in DOMPurify <= 3.4.12.
  dompurify@<3.4.13: "3.4.13"
  # GHSA-73wf-gq98-2v4g and GHSA-c83g-rgw3-j3cx: prototype write via untrusted
  # browserslist-stats.json and unbounded cache growth in browserslist <= 4.28.6.
  browserslist@<4.28.7: "4.28.7"
  # Held at 6.7.0: 6.7.1 correlated with large-editor scroll-probe failures
  # in the e2e chaos test (CI twice, locally not fully reproducible). The
  # override also guarantees a single copy — duplicate @codemirror/state
  # instances break Facet identity across the editor.
  "@codemirror/state": 6.7.0
  # One @tiptap/pm instantiation only: split peer graphs produce
  # incompatible editor extension types across the wysiwyg package.
  "@tiptap/pm": 3.29.2

patchedDependencies:
  emscripten-wasm-loader@3.0.3: patches/emscripten-wasm-loader@3.0.3.patch
  hunspell-asm@4.0.2: patches/hunspell-asm@4.0.2.patch
