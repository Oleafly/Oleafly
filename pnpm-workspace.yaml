packages:
  - "packages/*"

allowBuilds:
  esbuild: true

# Force the transitive nanoid (via hunspell-asm) to a patched version.
# GHSA-mwcw-c2x4-8c55: predictable results in nanoid < 3.3.8.
# Force the transitive postcss (via vite) to a patched version.
# GHSA-r28c-9q8g-f849: source-map path traversal in postcss <= 8.5.17.
overrides:
  nanoid@<3.3.8: ">=3.3.8"
  postcss@<8.5.18: ">=8.5.18"
  # Held at 6.7.0: 6.7.1 correlated with large-editor scroll-probe failures
  # in the e2e chaos test (CI twice, locally not fully reproducible). The
  # override also guarantees a single copy — duplicate @codemirror/state
  # instances break Facet identity across the editor.
  "@codemirror/state": 6.7.0
  # One @tiptap/pm instantiation only: split peer graphs produce
  # incompatible editor extension types across the wysiwyg package.
  "@tiptap/pm": 3.29.2

patchedDependencies:
  emscripten-wasm-loader@3.0.3: patches/emscripten-wasm-loader@3.0.3.patch
  hunspell-asm@4.0.2: patches/hunspell-asm@4.0.2.patch
