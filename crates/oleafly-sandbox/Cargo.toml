[package]
name = "oleafly-sandbox"
version = "0.1.0"
description = "Process and filesystem boundaries for Oleafly research-task commands and runs"
license = "AGPL-3.0-or-later"
publish = false
edition = "2021"
rust-version = "1.87"

[dependencies]
fs4 = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["process"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = ["process", "macros", "rt", "time"] }

[[bin]]
name = "oleafly-sandbox-launch"
path = "src/bin/oleafly-sandbox-launch.rs"
test = false
