[package]
name = "oleafly-collab"
version = "0.1.0"
description = "Device-local collaboration state, device key and share bindings for Oleafly"
license = "AGPL-3.0-or-later"
publish = false
edition = "2021"
rust-version = "1.89"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
httpdate = "1"
loro = "=1.16.2"
oleafly-collab-protocol = { path = "../oleafly-collab-protocol" }
oleafly-net = { path = "../oleafly-net" }
oleafly-ot = { path = "../oleafly-ot" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "stream"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["rustls-tls-webpki-roots"] }
unicode-normalization = "0.1"
url = "2.5"

[features]
e2e-hooks = ["oleafly-net/e2e-hooks"]

[dev-dependencies]
oleafly-ot = { path = "../oleafly-ot", features = ["test-support"] }
oleafly-server = { path = "../oleafly-server", features = ["test-support"] }
tempfile = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
