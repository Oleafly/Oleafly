[package]
name = "oleafly-lint"
version = "0.1.0"
description = "LaTeX, BibTeX, spelling and grammar checks for the Oleafly CLI"
license = "AGPL-3.0-or-later"
publish = false
edition = "2021"
rust-version = "1.88"

[features]
default = ["proofread"]
# Spelling and grammar through harper-core. Its dependencies need Rust 1.90
# (burn 0.19 needs 1.89, ordered-float 5.5 needs 1.90), so builds that must
# stay on an older Rust turn this off. Without it the crate builds on 1.88.
proofread = ["dep:harper-core"]

[dependencies]
# `thesaurus` only feeds the BoringWords rule, which stays off, and
# `concurrent` is off in the app's harper.js build too.
harper-core = { version = "=2.10.0", default-features = false, optional = true }
icu_properties = "2.2"
oleafly-preflight = { path = "../oleafly-preflight", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[dev-dependencies]
pretty_assertions = "1.4"
