[package]
name = "oleafly-realtime-server"
version = "0.1.0"
description = "Experimental self-hosted realtime collaboration server for Oleafly"
license = "AGPL-3.0-or-later"
publish = false
edition = "2021"
rust-version = "1.85"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
oleafly-realtime-protocol = { path = "../oleafly-realtime-protocol" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "migrate", "macros"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "=1.18.1", features = ["serde", "v4", "v7"] }
yrs = "=0.26.0"
zeroize = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.28"
