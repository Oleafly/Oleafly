[package]
name = "oleafly-online"
version = "0.1.0"
description = "Client, sessions and Git-bridge sync for an online LaTeX service, shared by the Oleafly app and CLI"
license = "AGPL-3.0-or-later"
publish = false
edition = "2021"
rust-version = "1.89"

[features]
# Fixture servers and builders other crates use in their own tests.
test-support = ["tokio/sync"]
# End-to-end tests against a local Overleaf Community Edition (tools/overleaf-ce/up.sh).
ce-e2e = ["test-support", "oleafly-core/test-support", "oleafly-ot/test-support"]

[dependencies]
aes = { version = "0.9", features = ["zeroize"] }
cbc = { version = "0.2", features = ["zeroize"] }
futures-util = { version = "0.3", features = ["sink"] }
oleafly-core = { path = "../oleafly-core" }
oleafly-net = { path = "../oleafly-net" }
oleafly-ot = { path = "../oleafly-ot" }
oleafly-secrets = { path = "../oleafly-secrets" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "stream"] }
ring = "0.17"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2.5"
zeroize = "=1.9.0"
zip = { version = "9.1", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
security-framework = "=2.11.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[[test]]
name = "browser_signin"
harness = false

[[test]]
name = "realtime_tls"
required-features = ["test-support"]

[[test]]
name = "ce"
required-features = ["ce-e2e"]

[[example]]
name = "e2e_overleaf"
required-features = ["test-support"]

[dev-dependencies]
oleafly-net = { path = "../oleafly-net", features = ["test-support"] }
oleafly-ot = { path = "../oleafly-ot", features = ["test-support"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = { workspace = true }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
