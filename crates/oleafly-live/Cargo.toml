[package]
name = "oleafly-live"
version = "0.1.0"
description = "Live editing in the project folder for collaboration server and online LaTeX service projects, shared by the Oleafly app and CLI"
license = "AGPL-3.0-or-later"
publish = false
edition = "2021"
rust-version = "1.89"

[features]
test-support = []

[dependencies]
futures-util = "0.3"
oleafly-collab = { path = "../oleafly-collab" }
oleafly-collab-protocol = { path = "../oleafly-collab-protocol" }
oleafly-core = { path = "../oleafly-core" }
oleafly-history = { path = "../oleafly-history" }
oleafly-online = { path = "../oleafly-online" }
oleafly-ot = { path = "../oleafly-ot" }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
unicode-normalization = "0.1"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[dev-dependencies]
oleafly-online = { path = "../oleafly-online", features = ["test-support"] }
