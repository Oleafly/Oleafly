[package]
name = "oleafly-research"
version = "0.1.0"
description = "Research tasks for Oleafly: task store, isolation, scheduler, task tools and the research MCP bridge"
license = "AGPL-3.0-or-later"
publish = false
edition = "2021"
rust-version = "1.87"

[features]
# Test helpers other crates use in their own tests (owner overrides, counters).
test-support = []

[dependencies]
oleafly-core = { path = "../oleafly-core" }
oleafly-agent = { path = "../oleafly-agent" }
oleafly-sandbox = { path = "../oleafly-sandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
sha2 = "0.10"
tempfile = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "process", "io-util", "fs", "net"] }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
thiserror = "2"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
base64 = "0.23"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
zeroize = "=1.9.0"
unicode-normalization = "0.1"
async-trait = "0.1"
biblatex = "0.12.0"
pdf-extract = "0.12"
roxmltree = "0.20"
fs4 = "1.1"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "process", "io-util", "fs", "net"] }
