[package]
name = "oleafly-collab-protocol"
version = "0.1.0"
description = "Wire types for Oleafly live collaboration, shared by the app and Oleafly Server"
license = "AGPL-3.0-or-later"
publish = false
edition = "2021"
rust-version = "1.89"

[dependencies]
base64 = "0.23"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
uuid = { version = "1.24", features = ["v7"] }
