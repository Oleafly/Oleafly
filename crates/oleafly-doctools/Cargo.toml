[package]
name = "oleafly-doctools"
version = "0.1.0"
description = "Document tools shared by the Oleafly app and CLI: SyncTeX, word counts, bibliography cleanup, export and conversion"
license = "AGPL-3.0-or-later"
publish = false
edition = "2021"
rust-version = "1.87"

[dependencies]
oleafly-core = { path = "../oleafly-core" }
biblatex = "0.12.0"
rand = "0.8"
rapidfuzz = "0.5.0"
sha2 = "0.10"
tempfile = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
icu_properties = "~2.2"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
