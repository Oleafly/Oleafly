[package]
name = "oleafly-preflight"
version = "0.1.0"
description = "Preflight checks shared by the Oleafly CLI"
license = "AGPL-3.0-or-later"
publish = false
edition = "2021"
rust-version = "1.88"

[features]
default = ["pdf"]
# PDF facts (page sizes, fonts, links, outlines, attachments) read with lopdf.
# lopdf 0.42 uses let chains, so it needs Rust 1.88 although it declares 1.85.
pdf = ["dep:lopdf", "dep:flate2"]

[dependencies]
fancy-regex = "0.19"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"], optional = true }
icu_properties = "2.2"
lopdf = { version = "0.42", default-features = false, optional = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = { workspace = true }
