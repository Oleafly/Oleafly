[package]
name = "oleafly-synctex"
version = "0.1.0"
description = "SyncTeX parsing and forward and inverse search, shared by the Oleafly app, CLI and browser app"
license = "AGPL-3.0-or-later"
publish = false
edition = "2021"
rust-version = "1.87"

[dependencies]
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
