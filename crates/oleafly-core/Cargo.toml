[package]
name = "oleafly-core"
version = "0.1.0"
description = "Shared project, path, and build preparation for Oleafly"
license = "AGPL-3.0-or-later"
publish = false
edition = "2021"
rust-version = "1.87"

[dependencies]
aho-corasick = "1"
blake3 = "1.8"
fastcdc = "5"
crc32fast = "1"
fs4 = "1.1"
memchr = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = { workspace = true }
toml_edit = "0.25"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
