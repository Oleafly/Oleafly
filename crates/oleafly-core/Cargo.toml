[package]
name = "oleafly-core"
version = "0.1.0"
description = "Shared project, path, and build preparation for Oleafly"
license = "AGPL-3.0-or-later"
publish = false
edition = "2021"
rust-version = "1.77"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = { workspace = true }
