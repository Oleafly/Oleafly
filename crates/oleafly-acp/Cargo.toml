[package]
name = "oleafly-acp"
version = "0.1.0"
description = "Tauri-free Agent Client Protocol client for Oleafly"
license = "AGPL-3.0-or-later"
publish = false
edition = "2021"
# The official ACP SDK and schema crates need Rust 1.88.
rust-version = "1.88"

[dependencies]
agent-client-protocol = { version = "=3.5.0", default-features = false, features = ["unstable_protocol_v2"] }
agent-client-protocol-schema = { version = "=1.12.0", default-features = false }
base64 = "0.23"
encoding_rs = "0.8"
futures = "0.3"
oleafly-core = { path = "../oleafly-core" }
oleafly-sandbox = { path = "../oleafly-sandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
url = "2"
zeroize = "=1.9.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[dev-dependencies]
agent-client-protocol-schema = { version = "=1.12.0", default-features = false, features = ["unstable_session_fork", "unstable_llm_providers", "unstable_end_turn_token_usage", "unstable_protocol_v2"] }
tempfile = { workspace = true }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[[test]]
name = "process"
harness = false
