[package]
name = "oleafly-agent"
version = "0.1.0"
description = "LLM provider clients and agent orchestration for Oleafly"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.87"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "net"] }
futures-util = "0.3"
base64 = "0.23"
dom_query = "0.28"
encoding_rs = "0.8"
url = "2.5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
