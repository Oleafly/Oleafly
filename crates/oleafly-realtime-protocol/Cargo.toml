[package]
name = "oleafly-realtime-protocol"
version = "0.1.0"
description = "Versioned realtime collaboration contracts for Oleafly"
license = "AGPL-3.0-or-later"
publish = false
edition = "2021"
rust-version = "1.77"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "=0.1.25"
uuid = { version = "=1.18.1", features = ["serde"] }
yrs = "=0.26.0"

[dev-dependencies]
base64 = "0.22"
sha2 = "0.10"
